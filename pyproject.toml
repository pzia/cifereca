[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cifereca"
version = "0.9.44+dev.13"
description = "Core desktop GTK4/libadwaita extensible pour bibliothèque numérique et acquisition par plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apsw>=3.54.0,<3.55",
  "httpx>=0.28.1,<0.29",
  "httpcore>=1.0,<1.1",
  "packaging>=24,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
cifereca = "cifereca.__main__:main"
cifereca-cli = "cifereca.cli:main"
cifereca-update = "cifereca.updater:main"
cifereca-update-dev = "cifereca.dev_updater:main"
cifereca-plugin-test = "cifereca.plugin_test_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
cifereca = ["builtin_ui/*.json", "builtin_ui/*.py", "plugin-release.json", "_build_revision.txt"]
