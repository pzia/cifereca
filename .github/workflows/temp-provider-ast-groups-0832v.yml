name: TEMP provider AST groups 0832v
on:
  pull_request:
    paths:
      - .github/workflows/temp-provider-ast-groups-0832v.yml
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure provider groups
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_provider_core_coupling_report.py --json > /tmp/provider-loc.json
          python3 -m scripts.ci_provider_ast_function_worklist --json > /tmp/provider-functions.json
          python3 - <<'PY'
          import json,subprocess
          d=json.load(open('/tmp/provider-loc.json'))
          f=json.load(open('/tmp/provider-functions.json'))
          print('MEASURE_RESULT_BEGIN')
          print(json.dumps({'sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':d['total_core_python_files'],'dedicated':d['historical']['dedicated_by_provider'],'named':d['vendor_named_modules_outside_legacy_dedicated_scope'],'generic':d['remaining_generic_after_expanded_named_scope'],'aliases':d['generic_ast_signal_occurrences_by_provider_alias'],'errors':d['historical']['parse_errors'],'ast':{'total':f['unique_lines'],'responsibilities':f['unique_lines_by_responsibility'],'functions':f['functions'],'files':f['files'],'top':f['top_functions'][:65],'parse_errors':f['parse_errors']}},sort_keys=True,ensure_ascii=False))
          print('MEASURE_RESULT_END')
          PY
