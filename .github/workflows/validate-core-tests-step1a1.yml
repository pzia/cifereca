name: Validate Core tests step 1A1

on:
  push:
    branches:
      - rationalization/core-tests-step1a1
    paths:
      - '.github/workflows/validate-core-tests-step1a1.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run restored tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          timeout 60s python -m pytest -q             tests/test_identity_selection_081.py             tests/test_storage.py             tests/test_locking.py             tests/test_client_mock.py
          rm -f .github/workflows/validate-core-tests-step1a1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate Core tests step 1A1'
          git push origin HEAD:rationalization/core-tests-step1a1
