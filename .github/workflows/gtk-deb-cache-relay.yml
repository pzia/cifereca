# Template de relais réseau pour construire le cache GTK Debian 13.
#
# Ce fichier n'est PAS un workflow actif. Pour l'utiliser :
# 1. créer une branche technique temporaire ;
# 2. copier ce fichier vers .github/workflows/gtk-deb-cache-relay.yml ;
# 3. remplacer ux/gtk-deb-cache-relay-20261011 ci-dessous par le nom de la branche ;
# 4. pousser le workflow sur cette branche ;
# 5. récupérer l'artefact puis supprimer/fermer la branche.
#
# Ne pas merger ce workflow uniquement pour fabriquer un cache ponctuel.

name: GTK Debian 13 cache relay

on:
  push:
    branches:
      - ux/gtk-deb-cache-relay-20261011
    paths:
      - ".github/workflows/gtk-deb-cache-relay.yml"

permissions:
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build Debian 13 GTK4 deb cache
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .gtk-deb-cache
          mkdir -p .gtk-deb-cache
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/environnements/openai-chat-debian \
            debian:trixie \
            bash -lc '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 ca-certificates debian-archive-keyring apt-utils dpkg tar xz-utils
              python3 bootstrap.py \
                --download-only \
                --deb-cache /work/.gtk-deb-cache
            '

          # APT crée partial/ avec des droits root dans le conteneur.
          sudo chown -R "$(id -u):$(id -g)" .gtk-deb-cache
          rm -rf .gtk-deb-cache/partial

          tar -C "$GITHUB_WORKSPACE" \
            -czf gtk4-deb-cache-debian13-trixie-amd64.tar.gz \
            .gtk-deb-cache
          cp environnements/openai-chat-debian/packages-lock.json \
            packages-lock.debian13.json

          echo "deb_count=$(find .gtk-deb-cache -maxdepth 1 -name '*.deb' | wc -l)" \
            >> "$GITHUB_STEP_SUMMARY"
          du -sh .gtk-deb-cache gtk4-deb-cache-debian13-trixie-amd64.tar.gz \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtk4-deb-cache-debian13-trixie-amd64
          path: |
            gtk4-deb-cache-debian13-trixie-amd64.tar.gz
            packages-lock.debian13.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
