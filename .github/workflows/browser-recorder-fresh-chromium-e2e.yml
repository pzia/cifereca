name: Browser Recorder · fresh Chromium opt-in E2E

# #2628: the product NEVER downloads on discovery or without explicit consent.
# Network/apt activity here is CI SETUP or a single opt-in Core test iteration,
# in a disposable runner with no accounts, vendor endpoints or private traces.
on:
  pull_request:
    paths:
      - 'src/cifereca/plugins/playwright_browser.py'
      - 'src/cifereca/gui/plugin_manager_page.py'
      - 'tests/test_core_p0_2628_real_chromium_provisioning_e2e.py'
      - '.github/workflows/browser-recorder-fresh-chromium-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-recorder-fresh-provision-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fresh:
    name: Fresh venv · consented Core headed Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create a clean user venv and install only Core/Playwright Python
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/recorder-clean-venv"
          "$RUNNER_TEMP/recorder-clean-venv/bin/python" -m pip install --disable-pip-version-check \
            -e . 'playwright>=1.50,<2' 'pytest>=8,<9'
          mkdir -p "$RUNNER_TEMP/empty-browser-home"
          test ! -e "$RUNNER_TEMP/empty-browser-home/.cache/ms-playwright"
      - name: Install Linux native Chromium libraries (CI setup only)
        run: |
          set -euo pipefail
          # Administration of throwaway CI runner only, never application behavior.
          sudo "$RUNNER_TEMP/recorder-clean-venv/bin/python" -m playwright install-deps chromium
      - name: Check no consent/no download, then opt-in Core install and real launch
        run: |
          set -euo pipefail
          env -u PLAYWRIGHT_BROWSERS_PATH \
              -u PLAYWRIGHT_DOWNLOAD_HOST \
              -u PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST \
              HOME="$RUNNER_TEMP/empty-browser-home" \
              CIFERECA_REAL_CHROMIUM_PROVISION_E2E=1 \
              "$RUNNER_TEMP/recorder-clean-venv/bin/python" -m pytest -q -rs \
              tests/test_core_p0_2628_real_chromium_provisioning_e2e.py
      - name: No browser profile, HAR or private ZIP artifacts published
        if: always()
        run: |
          echo 'Fresh venv and temporary HOME: Core opt-in Chromium only. No vendor, user account, private trace, screenshot or ZIP archived.' >> "$GITHUB_STEP_SUMMARY"
