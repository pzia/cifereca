name: Restore Core tests step 1A11

on:
  push:
    branches:
      - rationalization/core-tests-step1a11
    paths:
      - '.restore-tests-step1a11/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate identity directory test
        shell: bash
        run: |
          set -euo pipefail
          cp .restore-tests-step1a11/payload.tar.xz /tmp/core-tests-step1a11.tar.xz
          echo "0a05ea1d8165650ae7d0e444542251a8ce5e1e0f985fad07d1f916a86880b5e7  /tmp/core-tests-step1a11.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a11.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q tests/test_identity_directory_099_dev2.py

          rm -rf .restore-tests-step1a11
          rm -f .github/workflows/restore-core-tests-step1a11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore identity directory migration regression tests'
          git push origin HEAD:rationalization/core-tests-step1a11
