name: UX master-detail review step 3

on:
  push:
    branches:
      - ux/master-detail-review-step3
    paths:
      - ".github/workflows/ux-master-detail-review-step3.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-master-detail-review
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 560db4a16e3a67a2acb8c373a671b612451d90a8

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxtst6 \
            python3-gi python3-gi-cairo python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-httpx python3-packaging

      - name: Prepare controlled detail fixture
        shell: bash
        run: |
          set -euxo pipefail
          cat > simulation/profiles/ux-detail-review.toml <<'EOF'
          name = "ux-detail-review"
          description = "Recette UX master-detail normal + riche"

          [runtime]
          startup_timeout_seconds = 20

          [cifereca]
          binary = "cifereca"
          no_plugins = true
          width = 1366
          height = 768

          [library]
          epubs = 2
          seed = 20261008
          identity_dir = "ux"
          provider_dir = "local"
          EOF

          /usr/bin/python3 simulation/datasetctl.py rebuild ux-detail-review

          /usr/bin/python3 - <<'PY'
          from dataclasses import replace
          from io import BytesIO
          from pathlib import Path
          import zipfile

          from simulation.common.fake_books import FakeBookFactory, epub_bytes

          root = Path("/tmp/cifereca-master-detail-review/ux-detail-review/library/ux/local")
          for p in root.glob("*.epub"):
              p.unlink()

          factory = FakeBookFactory(20261008, "ux-detail-review")
          normal = replace(
              factory.make(1),
              title="UXNORMAL — Le jardin des Amandiers",
              author="Zoé Martin",
              publisher="Éditions du Passage",
              subject="Roman",
              language="fr",
              description="Un roman fictif de test avec un jeu de métadonnées volontairement simple."
          )
          rich = replace(
              factory.make(2),
              title="UXRICH — L’atlas des marées et des villes invisibles",
              author="Éléonore d’Aubigné-Longchamp",
              publisher="Maison des Brumes",
              subject="Exploration",
              language="fr",
              description=(
                  "Une description volontairement riche pour tester la lisibilité du panneau détail. "
                  "Elle combine plusieurs informations éditoriales, une collection, plusieurs auteurs, "
                  "des contributeurs et plusieurs sujets sans être un cas pathologique."
              )
          )

          (root / "01-normal.epub").write_bytes(epub_bytes(normal))

          payload = epub_bytes(rich)
          src = zipfile.ZipFile(BytesIO(payload), "r")
          out = BytesIO()
          with src, zipfile.ZipFile(out, "w") as dst:
              for info in src.infolist():
                  data = src.read(info.filename)
                  if info.filename == "OEBPS/content.opf":
                      text = data.decode("utf-8")
                      text = text.replace(
                          "<dc:creator>Éléonore d’Aubigné-Longchamp</dc:creator>",
                          "<dc:creator id=\"a1\">Éléonore d’Aubigné-Longchamp</dc:creator>"
                          "<dc:creator id=\"a2\">Lucien Roche</dc:creator>"
                          "<dc:contributor id=\"c1\">Camille Faure</dc:contributor>"
                      )
                      text = text.replace(
                          "<dc:subject>Exploration</dc:subject>",
                          "<dc:subject>Exploration</dc:subject>"
                          "<dc:subject>Cartographie</dc:subject>"
                          "<dc:subject>Voyage</dc:subject>"
                          "<dc:rights>Licence de test — usage démonstration</dc:rights>"
                          "<meta name=\"calibre:series\" content=\"Les Cartographes du large\"/>"
                          "<meta name=\"calibre:series_index\" content=\"3\"/>"
                      )
                      data = text.encode("utf-8")
                  dst.writestr(info, data)
          (root / "02-rich.epub").write_bytes(out.getvalue())
          PY

          /usr/bin/python3 simulation/datasetctl.py exec ux-detail-review -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /usr/bin/python3 -m cifereca.cli catalog-scan \
            > /tmp/catalog-scan.json

      - name: Write review driver
        shell: bash
        run: |
          cat > /tmp/master_detail_review.py <<'PY'
          from __future__ import annotations
          import argparse
          import ctypes as C
          import json, os, subprocess, sys, time
          from pathlib import Path
          from PIL import ImageGrab

          ROOT=Path.cwd()
          sys.path.insert(0, str(ROOT/"environnements"/"openai-chat-debian"))
          from x11_input import X11Input

          ap=argparse.ArgumentParser()
          ap.add_argument("--width",type=int,required=True)
          ap.add_argument("--height",type=int,default=768)
          ap.add_argument("--out",type=Path,required=True)
          args=ap.parse_args()
          args.out.mkdir(parents=True, exist_ok=True)

          def capture(name):
              p=args.out/name
              ImageGrab.grab(xdisplay=os.environ["DISPLAY"]).save(p)
              return str(p)

          def shortcut(c, mod, key):
              c.key(mod,True)
              try:
                  c.key(key,True); c.key(key,False)
              finally:
                  c.key(mod,False)

          def resize(c):
              x11=c.x11; display=c.display
              x11.XDefaultRootWindow.argtypes=[C.c_void_p]; x11.XDefaultRootWindow.restype=C.c_ulong
              x11.XQueryTree.argtypes=[C.c_void_p,C.c_ulong,C.POINTER(C.c_ulong),C.POINTER(C.c_ulong),C.POINTER(C.POINTER(C.c_ulong)),C.POINTER(C.c_uint)]
              x11.XQueryTree.restype=C.c_int
              x11.XGetGeometry.argtypes=[C.c_void_p,C.c_ulong,C.POINTER(C.c_ulong),C.POINTER(C.c_int),C.POINTER(C.c_int),C.POINTER(C.c_uint),C.POINTER(C.c_uint),C.POINTER(C.c_uint),C.POINTER(C.c_uint)]
              x11.XGetGeometry.restype=C.c_int
              x11.XMoveResizeWindow.argtypes=[C.c_void_p,C.c_ulong,C.c_int,C.c_int,C.c_uint,C.c_uint]
              x11.XFree.argtypes=[C.c_void_p]
              root=x11.XDefaultRootWindow(display); rr=C.c_ulong(); pr=C.c_ulong(); children=C.POINTER(C.c_ulong)(); n=C.c_uint()
              if not x11.XQueryTree(display,root,C.byref(rr),C.byref(pr),C.byref(children),C.byref(n)): return None
              best=None
              try:
                  for i in range(n.value):
                      xid=children[i]; gr=C.c_ulong(); x=C.c_int(); y=C.c_int(); w=C.c_uint(); h=C.c_uint(); b=C.c_uint(); d=C.c_uint()
                      if x11.XGetGeometry(display,xid,C.byref(gr),C.byref(x),C.byref(y),C.byref(w),C.byref(h),C.byref(b),C.byref(d)):
                          area=int(w.value)*int(h.value)
                          if w.value>500 and h.value>400 and (best is None or area>best[0]):
                              best=(area,int(xid),int(w.value),int(h.value))
                  if not best: return None
                  _,xid,bw,bh=best
                  x11.XMoveResizeWindow(display,xid,0,0,args.width,args.height)
                  x11.XSync(display,False); time.sleep(.8)
                  return {"before":[bw,bh],"requested":[args.width,args.height]}
              finally:
                  if children: x11.XFree(children)

          def search(control, text):
              shortcut(control,"Control_L","f"); time.sleep(.5)
              control.select_all_delete(); control.type_text(text)
              control.key("Return",True); control.key("Return",False)
              time.sleep(2.5)

          def click_cover(control):
              x=280 if args.width>=1100 else 260
              control.click(x, 245); time.sleep(2.0)

          def scroll_detail(control, steps=8):
              x=max(720, int(args.width*.78)); y=int(args.height*.68)
              control.xtst.XTestFakeMotionEvent(control.display,-1,x,y,0)
              for _ in range(steps):
                  control.xtst.XTestFakeButtonEvent(control.display,5,True,0)
                  control.xtst.XTestFakeButtonEvent(control.display,5,False,0)
              control.x11.XSync(control.display,False); time.sleep(1)

          out=(args.out/"cifereca.stdout.log").open("w")
          err=(args.out/"cifereca.stderr.log").open("w")
          app=subprocess.Popen([
              "/usr/bin/python3","-m","cifereca",
              "--no-plugins",
              "--force-plugin","core.ui.pages",
              "--force-plugin","core.ui.widgets",
              "--force-plugin","core.ui.titlebar",
              "--force-plugin","core.ui.system",
              "--verbose"
          ],cwd=ROOT,env=os.environ.copy(),stdout=out,stderr=err,text=True)

          control=None
          report={"width":args.width,"shots":[]}
          try:
              time.sleep(6)
              if app.poll() is not None: raise RuntimeError(f"app rc={app.returncode}")
              control=X11Input(); report["resize"]=resize(control); time.sleep(1)

              search(control,"UXNORMAL"); click_cover(control)
              report["shots"].append(capture("01-search-normal-detail.png"))

              search(control,"UXRICH"); click_cover(control)
              report["shots"].append(capture("02-search-rich-detail.png"))
              scroll_detail(control,10)
              report["shots"].append(capture("03-search-rich-detail-scrolled.png"))

              # Navigate to Bibliothèque through the real sidebar.
              control.click(105, 248); time.sleep(3)
              shortcut(control,"Control_L","f"); time.sleep(.5)
              control.select_all_delete(); control.type_text("UXRICH")
              time.sleep(2)
              click_cover(control)
              report["shots"].append(capture("04-library-rich-detail.png"))

              (args.out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          finally:
              if control:
                  try: shortcut(control,"Control_L","q")
                  except Exception: pass
                  control.close()
              try: app.wait(timeout=4)
              except subprocess.TimeoutExpired:
                  app.terminate()
                  try: app.wait(timeout=3)
                  except subprocess.TimeoutExpired: app.kill(); app.wait()
              out.close(); err.close()
          PY

      - name: Capture master-detail at two widths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p master-detail-evidence
          for width in 1024 1366; do
            /usr/bin/python3 simulation/datasetctl.py exec ux-detail-review -- \
              env PYTHONPATH="$GITHUB_WORKSPACE/src" GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none NO_AT_BRIDGE=1 \
              xvfb-run -a -s "-screen 0 ${width}x768x24" \
                /usr/bin/python3 /tmp/master_detail_review.py \
                  --width "$width" --height 768 \
                  --out "$GITHUB_WORKSPACE/master-detail-evidence/$width"
          done
          cp /tmp/catalog-scan.json master-detail-evidence/catalog-scan.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-master-detail-review-step3
          path: master-detail-evidence/
          if-no-files-found: error
          retention-days: 2
