name: GTK headless smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtk-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gtk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap rootless GTK runtime
        working-directory: environnements/chatgpt-work
        run: ./work bootstrap

      - name: Verify GTK imports
        working-directory: environnements/chatgpt-work
        run: ./work check-import

      - name: Install Core Python dependencies in GTK environment
        working-directory: environnements/chatgpt-work
        run: |
          source ./env.sh
          .venv/bin/python -m pip install --disable-pip-version-check -e ../..

      - name: Capture Core-only GTK smoke
        working-directory: environnements/chatgpt-work
        run: |
          mkdir -p evidence
          ./work capture \
            --screen 1300x900x24 \
            --wait 3 \
            --out evidence/core-smoke.png \
            --cwd "${GITHUB_WORKSPACE}" \
            -- \
            environnements/chatgpt-work/run-cifereca --no-plugins --verbose

      # Untrusted pixels, GTK reports and full Xvfb/DBus logs remain inside
      # this ephemeral runner. Only constants and existence booleans leave it.
      - name: Generate bounded GTK smoke verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          artifacts = Path("environnements/chatgpt-work/evidence")
          output = Path(os.environ["RUNNER_TEMP"]) / "gtk-smoke-public"
          output.mkdir(parents=True, exist_ok=False)
          facts = {
              "schema": "cifereca-gtk-smoke-verdict/v1",
              "scenario": "core-no-plugins",
              "capture_generated": (artifacts / "core-smoke.png").is_file(),
              "report_generated": (artifacts / "core-smoke.json").is_file(),
          }
          (output / "result.json").write_text(
              json.dumps(facts, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload GTK smoke verdict only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-smoke-verdict
          path: ${{ runner.temp }}/gtk-smoke-public/result.json
          if-no-files-found: ignore
          retention-days: 2
