name: GTK headless smoke

on:
  pull_request:
    paths:
      - "src/cifereca/app.py"
      - "src/cifereca/gui/**"
      - "src/cifereca/builtin_ui/**"
      - "environnements/chatgpt-work/**"
      - ".github/workflows/gtk-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtk-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gtk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap rootless GTK runtime
        working-directory: environnements/chatgpt-work
        run: ./work bootstrap

      - name: Verify GTK imports
        working-directory: environnements/chatgpt-work
        run: ./work check-import

      - name: Install Core Python dependencies in GTK environment
        working-directory: environnements/chatgpt-work
        run: |
          source ./env.sh
          .venv/bin/python -m pip install --disable-pip-version-check -e ../..

      - name: Capture Core-only GTK smoke
        working-directory: environnements/chatgpt-work
        run: |
          mkdir -p evidence
          ./work capture \
            --screen 1300x900x24 \
            --wait 3 \
            --out evidence/core-smoke.png \
            --cwd "${GITHUB_WORKSPACE}" \
            -- \
            environnements/chatgpt-work/run-cifereca --no-plugins --verbose

      - name: Upload GTK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-smoke-evidence
          path: |
            environnements/chatgpt-work/evidence/core-smoke.png
            environnements/chatgpt-work/evidence/core-smoke.json
            environnements/chatgpt-work/evidence/xvfb.log
            environnements/chatgpt-work/evidence/dbus.log
          if-no-files-found: warn
