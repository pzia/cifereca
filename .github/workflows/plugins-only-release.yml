name: Release plugins-only

on:
  # Only an explicit, reviewed release request on main triggers publication.
  # Ordinary commits on main do not trigger a plugins-only release.
  push:
    branches: [main]
    paths:
      - ".github/plugins-only-release-request.json"
  pull_request:
    paths:
      - ".github/workflows/plugins-only-release.yml"
      - "scripts/ci-plugins-only-runtime-gate.sh"
      - "scripts/ci-plugins-only-historical-core-gate.sh"
      - "scripts/ci_plugins_release_target.py"
      - "scripts/test_partial_plugin_release.py"
      - "scripts/package_partial_plugins.py"
      - "scripts/plugin_packaging.py"
      - "src/cifereca/dev_updater.py"
      - "tests/test_dev_partial_plugin_updates.py"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag plugins-only (plugins-v<CORE_VERSION>-<SERIAL>)"
        required: true
        type: string
      package_ids:
        description: "Comma-separated package IDs to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugins-only-release-${{ inputs.release_tag || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "setuptools>=69" wheel "pytest>=8,<9" \
            "packaging>=24,<26" "httpx>=0.28.1,<0.29"

      - name: Validate packaging and strict updater tests
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release
          python -m pytest -q tests/test_dev_partial_plugin_updates.py

      - name: Build deterministic PR plugins-only snapshot
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="plugins-v${version}-pr-${{ github.event.pull_request.number }}"
          python -m scripts.package_partial_plugins \
            --packages "org.cifereca.ui.page.diagnostics,org.cifereca.youth-source-discovery" \
            --id "$tag" \
            --out dist
          archive="dist/$tag.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          python -m scripts.package_partial_plugins --verify "$archive"
          (cd dist && sha256sum -c "$tag.zip.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Exercise the real plugins-only runtime gate
        shell: bash
        env:
          CIFERECA_P0_GATE_ROOT: ${{ runner.temp }}/cifereca-p0-pr-gate
        run: bash scripts/ci-plugins-only-runtime-gate.sh "${{ steps.build.outputs.archive }}"

      - name: Reject strict update on a genuinely installed historic Core
        shell: bash
        env:
          CIFERECA_P0_GATE_ROOT: ${{ runner.temp }}/cifereca-p0-pr-gate
        run: bash scripts/ci-plugins-only-historical-core-gate.sh "${{ steps.build.outputs.archive }}"

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure isolated runtime directories
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CIFERECA_P0_GATE_ROOT=$RUNNER_TEMP/cifereca-p0"
            echo "CIFERECA_INSTALL_ROOT=$RUNNER_TEMP/cifereca-p0/runtime"
            echo "CIFERECA_BIN_DIR=$RUNNER_TEMP/cifereca-p0/bin"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/cifereca-p0/data"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/cifereca-p0/state"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/cifereca-p0/config"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve explicitly authorized release request
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DISPATCH_PACKAGES: ${{ inputs.package_ids }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              request = json.loads(
                  Path(".github/plugins-only-release-request.json").read_text(encoding="utf-8")
              )
              if request.get("kind") != "authorized-plugins-only-release":
                  raise SystemExit("Invalid explicit release request")
              tag = request["release_tag"]
              selected = request["package_ids"]
          elif os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              tag = os.environ["DISPATCH_TAG"]
              selected = os.environ["DISPATCH_PACKAGES"].split(",")
          else:
              raise SystemExit("Publication requires an explicit dispatch or main release request")

          if not isinstance(tag, str) or not re.fullmatch(r"plugins-v[0-9A-Za-z.+_-]+", tag):
              raise SystemExit("Invalid plugins-only release tag")
          if not isinstance(selected, list) or not selected:
              raise SystemExit("At least one package id is required")
          if any(
              not isinstance(package, str)
              or not re.fullmatch(r"org\.cifereca\.[A-Za-z0-9._-]+", package)
              for package in selected
          ):
              raise SystemExit("Invalid package id")
          if len(selected) != len(set(selected)):
              raise SystemExit("Duplicate package ids")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as destination:
              destination.write(f"RELEASE_TAG={tag}\nPACKAGE_IDS={','.join(selected)}\n")
          print(f"Release request: {tag}; packages: {', '.join(selected)}")
          PY

      - name: Require main and validate plugins-only tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Official plugins-only releases must be dispatched from main." >&2
            exit 1
          fi
          git fetch --tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not integrated into main." >&2
            exit 1
          }
          version="$(tr -d '[:space:]' < VERSION)"
          prefix="plugins-v${version}-"
          if [[ "$RELEASE_TAG" != "$prefix"* || "$RELEASE_TAG" == "$prefix" ]]; then
            echo "Tag must match ${prefix}<serial>; got $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $RELEASE_TAG points to $target, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check             "setuptools>=69" wheel "pytest>=8,<9"             "packaging>=24,<26" "httpx>=0.28.1,<0.29"

      - name: Validate packaging and updater regressions
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release
          python -m pytest -q tests/test_dev_partial_plugin_updates.py

      - name: Build selected official plugins-only snapshot
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.package_partial_plugins             --packages "$PACKAGE_IDS"             --id "$RELEASE_TAG"             --out dist
          archive="dist/$RELEASE_TAG.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Require published Core and validate the actual distributed wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_version="$(tr -d '[:space:]' < VERSION)"
          core_tag="v$core_version"
          wheel="cifereca-$core_version-py3-none-any.whl"
          core_dir="$RUNNER_TEMP/published-core"
          mkdir -p "$core_dir/source"

          # A source checkout matching VERSION does NOT prove compatibility
          # with the Core bytes already delivered to end users.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$core_tag" > "$core_dir/release.json"
          gh release download "$core_tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$core_dir" --pattern "$wheel" --pattern "SHA256SUMS"
          git rev-parse --verify "refs/tags/$core_tag^{commit}" >/dev/null
          tag_sha="$(git rev-list -n 1 "$core_tag")"
          git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA" || {
            echo "Published Core tag $core_tag is not an ancestor of this plugins release." >&2
            exit 1
          }

          # Cross-check GitHub's release digest, downloaded SHA256SUMS and
          # actual wheel bytes, plus the published tag's immutable source SHA.
          python - "$core_dir/release.json" "$core_tag" "$tag_sha" \
            "$core_dir/$wheel" "$core_dir/SHA256SUMS" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          metadata_path, tag, commit, wheel_path, sums_path = sys.argv[1:]
          release = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if release.get("draft") or release.get("tag_name") != tag:
              raise SystemExit("Core release absent, still draft or wrong tag")
          if release.get("target_commitish") != commit:
              raise SystemExit("Core release tag does not match its declared source commit")
          assets = [a for a in release.get("assets", []) if a.get("name") == Path(wheel_path).name]
          if len(assets) != 1:
              raise SystemExit("Expected exactly one official Core wheel")
          digest = hashlib.sha256(Path(wheel_path).read_bytes()).hexdigest()
          if assets[0].get("digest") != "sha256:" + digest:
              raise SystemExit("Official Core wheel disagrees with GitHub asset digest")
          expected_line = digest + "  " + Path(wheel_path).name
          if Path(sums_path).read_text(encoding="utf-8").splitlines().count(expected_line) != 1:
              raise SystemExit("Official Core wheel disagrees with release SHA256SUMS")
          print(f"Verified published {tag}: source {commit}; wheel SHA-256 {digest}")
          PY

          # Check a genuine installation of the wheel uploaded to GitHub,
          # not the development checkout / wheel built in this CI job.
          python -m venv --system-site-packages "$core_dir/venv"
          "$core_dir/venv/bin/python" -m pip install --disable-pip-version-check \
            --no-deps "$core_dir/$wheel"
          (
            cd "$RUNNER_TEMP"
            "$core_dir/venv/bin/python" - "$core_version" <<'PY'
          import sys
          from importlib.metadata import version
          from cifereca.plugin_api.version import PLUGIN_API_VERSION

          installed = version("cifereca")
          if installed != sys.argv[1]:
              raise SystemExit(f"Published wheel version {installed} != {sys.argv[1]}")
          print(f"Verified installed published Core {installed}; Plugin API {PLUGIN_API_VERSION}")
          PY
            "$core_dir/venv/bin/cifereca-update-dev" --help > "$core_dir/updater-help.txt"
            grep -q -- '--require-plugins-only' "$core_dir/updater-help.txt"
            grep -q -- '--expected-sha256' "$core_dir/updater-help.txt"
          )

          # Exercise installs and rollback against the exact published tag
          # in the existing runtime gate, not the current checkout.
          git archive "$core_tag" | tar -x -C "$core_dir/source"
          test "$(tr -d '[:space:]' < "$core_dir/source/VERSION")" = "$core_version"
          echo "CIFERECA_P0_CORE_SOURCE=$core_dir/source" >> "$GITHUB_ENV"

      - name: Verify compatibility and strict updater preflight
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          python -m scripts.package_partial_plugins --verify "$archive"
          (cd dist && sha256sum -c "$RELEASE_TAG.zip.sha256")

          python -m pip install --no-deps --no-build-isolation .
          core_version="$(python -c 'import cifereca; print(cifereca.__version__)')"
          api_version="$(python -c 'from cifereca.plugin_api.version import PLUGIN_API_VERSION; print(PLUGIN_API_VERSION)')"

          python -m scripts.package_partial_plugins --verify "$archive"             --target-core-version "$core_version"             --target-plugin-api-version "$api_version"

          if python -m scripts.package_partial_plugins --verify "$archive"               --target-core-version "9999.0.0"               --target-plugin-api-version "$api_version"; then
            echo "Incompatible Core unexpectedly accepted." >&2
            exit 1
          fi

      - name: Exercise real strict install, incompatible refusal and rollback
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-plugins-only-runtime-gate.sh "${{ steps.build.outputs.archive }}"
          "$CIFERECA_BIN_DIR/cifereca-cli" plugin list > dist/plugins-only-runtime-inventory.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = {x.strip() for x in os.environ["PACKAGE_IDS"].split(",") if x.strip()}
          if not selected:
              raise SystemExit("Official release must select at least one package")
          rows = json.loads(Path("dist/plugins-only-runtime-inventory.json").read_text(encoding="utf-8"))
          visible = {str(r.get("package_id")) for r in rows if isinstance(r, dict) and r.get("package_id")}
          store = Path(os.environ["XDG_DATA_HOME"]) / "cifereca/plugins/packages"
          active = set()
          for package_id in selected:
              pointer = store / package_id / "current.json"
              if not pointer.is_file():
                  raise SystemExit("Selected package missing from installed store: " + package_id)
              state = json.loads(pointer.read_text(encoding="utf-8"))
              if state.get("active"):
                  active.add(package_id)
          missing_active = sorted(active - visible)
          if missing_active:
              raise SystemExit("Active selected packages missing from CLI: " + ", ".join(missing_active))
          unexpectedly_visible = sorted((selected - active) & visible)
          if unexpectedly_visible:
              raise SystemExit("Inactive selected packages unexpectedly visible: " + ", ".join(unexpectedly_visible))
          print(f"Official inventory: {len(active)} active, {len(selected)-len(active)} inactive")
          PY

      - name: Refuse strict update on a historic installed Core
        shell: bash
        run: bash scripts/ci-plugins-only-historical-core-gate.sh "${{ steps.build.outputs.archive }}"

      - name: Install Cosign for independent keyless provenance
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.6"

      # Private personal GitHub repositories cannot use GitHub-hosted
      # Artifact Attestations. Cosign signs exact ZIP bytes with GitHub OIDC.
      # The public Sigstore transparency log records provenance metadata,
      # NOT the private archive bytes.
      - name: Sign plugins-only ZIP with Sigstore keyless
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          test -s "$archive.sigstore.json"

      # Authenticity is verified before a draft or any release asset is created.
      # The SHA sidecar alone proves only integrity, not the signing identity.
      - name: Verify signed provenance before publishing
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          test -s "$archive"
          (cd dist && sha256sum -c "$RELEASE_TAG.zip.sha256")
          cosign verify-blob "$archive" \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/plugins-only-release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "$GITHUB_SHA"

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Refuse an existing draft whose tag belongs to another commit.
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
              python3 scripts/ci_plugins_release_target.py \
                --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
            gh release edit "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --title "$RELEASE_TAG"               --draft
          else
            gh release create "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$RELEASE_TAG"               --generate-notes               --draft
          fi
          # Verify new as well as reused draft metadata before any asset write.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            python3 scripts/ci_plugins_release_target.py \
              --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG"             "${{ steps.build.outputs.archive }}"             "${{ steps.build.outputs.archive }}.sha256"             "${{ steps.build.outputs.archive }}.sigstore.json"             --repo "$GITHUB_REPOSITORY"             --clobber

      # Download the GitHub-hosted draft assets, not the local build output.
      # Failure leaves the release as a draft and prevents publication.
      - name: Verify downloaded draft artifact and repeat P0 gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/p0-downloaded-official"
          mkdir -p "$artifact_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$artifact_dir" \
            --pattern "$RELEASE_TAG.zip" \
            --pattern "$RELEASE_TAG.zip.sha256" \
            --pattern "$RELEASE_TAG.zip.sigstore.json"
          (cd "$artifact_dir" && sha256sum -c "$RELEASE_TAG.zip.sha256")
          cmp "dist/$RELEASE_TAG.zip" "$artifact_dir/$RELEASE_TAG.zip"
          cmp "dist/$RELEASE_TAG.zip.sigstore.json" "$artifact_dir/$RELEASE_TAG.zip.sigstore.json"
          cosign verify-blob "$artifact_dir/$RELEASE_TAG.zip" \
            --bundle "$artifact_dir/$RELEASE_TAG.zip.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/plugins-only-release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "$GITHUB_SHA"
          export CIFERECA_P0_GATE_ROOT="$RUNNER_TEMP/cifereca-p0-downloaded"
          bash scripts/ci-plugins-only-runtime-gate.sh "$artifact_dir/$RELEASE_TAG.zip"
          bash scripts/ci-plugins-only-historical-core-gate.sh "$artifact_dir/$RELEASE_TAG.zip"

      - name: Recheck immutable draft target before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            python3 scripts/ci_plugins_release_target.py \
              --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

      - name: Publish completed plugins-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
