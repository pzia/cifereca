name: Release plugins-only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag plugins-only (plugins-v<CORE_VERSION>-<SERIAL>)"
        required: true
        type: string
      package_ids:
        description: "Comma-separated package IDs to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: plugins-only-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGE_IDS: ${{ inputs.package_ids }}
      CIFERECA_INSTALL_ROOT: ${{ runner.temp }}/cifereca-p0/runtime
      CIFERECA_BIN_DIR: ${{ runner.temp }}/cifereca-p0/bin
      XDG_DATA_HOME: ${{ runner.temp }}/cifereca-p0/data
      XDG_STATE_HOME: ${{ runner.temp }}/cifereca-p0/state
      XDG_CONFIG_HOME: ${{ runner.temp }}/cifereca-p0/config

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and validate plugins-only tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Official plugins-only releases must be dispatched from main." >&2
            exit 1
          fi
          git fetch --tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not integrated into main." >&2
            exit 1
          }
          version="$(tr -d '[:space:]' < VERSION)"
          prefix="plugins-v${version}-"
          if [[ "$RELEASE_TAG" != "$prefix"* || "$RELEASE_TAG" == "$prefix" ]]; then
            echo "Tag must match ${prefix}<serial>; got $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $RELEASE_TAG points to $target, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check             "setuptools>=69" wheel "pytest>=8,<9"             "packaging>=24,<26" "httpx>=0.28.1,<0.29"

      - name: Validate packaging and updater regressions
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release
          python -m pytest -q tests/test_dev_partial_plugin_updates.py

      - name: Build selected official plugins-only snapshot
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.package_partial_plugins             --packages "$PACKAGE_IDS"             --id "$RELEASE_TAG"             --out dist
          archive="dist/$RELEASE_TAG.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Verify compatibility and strict updater preflight
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          python -m scripts.package_partial_plugins --verify "$archive"
          (cd dist && sha256sum -c "$RELEASE_TAG.zip.sha256")

          python -m pip install --no-deps --no-build-isolation .
          core_version="$(python -c 'import cifereca; print(cifereca.__version__)')"
          api_version="$(python -c 'from cifereca.plugin_api.version import PLUGIN_API_VERSION; print(PLUGIN_API_VERSION)')"

          python -m scripts.package_partial_plugins --verify "$archive"             --target-core-version "$core_version"             --target-plugin-api-version "$api_version"

          if python -m scripts.package_partial_plugins --verify "$archive"               --target-core-version "9999.0.0"               --target-plugin-api-version "$api_version"; then
            echo "Incompatible Core unexpectedly accepted." >&2
            exit 1
          fi

          # Exercise the same immutable Core layout used by the production
          # updater. A plain pip install is not sufficient: plugins-only
          # compatibility is intentionally read from runtime/current.
          mkdir -p dist
          git archive --format=zip --prefix=cifereca-core/ HEAD > dist/cifereca-core-current.zip
          cifereca-update dist/cifereca-core-current.zip --keep 3 --json

          runtime_update_dev="$CIFERECA_BIN_DIR/cifereca-update-dev"
          runtime_cli="$CIFERECA_BIN_DIR/cifereca-cli"
          if ! "$runtime_update_dev" --help | grep -q -- '--require-plugins-only'; then
            echo "Strict plugins-only updater support is required; merge P0 #849 first." >&2
            exit 1
          fi

          digest="$(sha256sum "$archive" | awk '{print $1}')"
          "$runtime_update_dev" "$archive"             --require-plugins-only             --expected-sha256 "$digest"             --dry-run             --json

          # Real targeted install in the isolated runtime, not only dry-run.
          "$runtime_update_dev" "$archive"             --require-plugins-only             --expected-sha256 "$digest"             --json
          "$runtime_cli" plugin list > dist/plugins-only-runtime-inventory.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {x.strip() for x in os.environ["PACKAGE_IDS"].split(",") if x.strip()}
          rows = json.loads(Path("dist/plugins-only-runtime-inventory.json").read_text(encoding="utf-8"))
          visible = {
              str(row.get("package_id"))
              for row in rows
              if isinstance(row, dict) and row.get("package_id")
          }
          missing = sorted(expected - visible)
          if missing:
              raise SystemExit("Selected packages missing after real strict install: " + ", ".join(missing))
          PY

      - name: Exercise real strict install, incompatible refusal and rollback
        shell: bash
        env:
          CIFERECA_INSTALL_ROOT: ${{ runner.temp }}/cifereca-p0/runtime
          CIFERECA_BIN_DIR: ${{ runner.temp }}/cifereca-p0/bin
          XDG_DATA_HOME: ${{ runner.temp }}/cifereca-p0/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/cifereca-p0/config
          XDG_STATE_HOME: ${{ runner.temp }}/cifereca-p0/state
          XDG_CACHE_HOME: ${{ runner.temp }}/cifereca-p0/cache
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          rm -rf "$RUNNER_TEMP/cifereca-p0"
          mkdir -p "$CIFERECA_BIN_DIR" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"

          python - <<'PY'
          from pathlib import Path
          from cifereca.updater import install_source
          result = install_source(Path("."), keep=3)
          if not result.get("ok") or not result.get("current"):
              raise SystemExit(f"isolated Core install failed: {result}")
          PY

          read -r package_id package_version <<<"$(python - "$archive" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              matches = [n for n in z.namelist() if n.endswith("/cifereca-plugins-only.json")]
              if len(matches) != 1:
                  raise SystemExit("plugins-only index missing or ambiguous")
              index = json.loads(z.read(matches[0]))
          if not index.get("packages"):
              raise SystemExit("plugins-only package selection is empty")
          row = index["packages"][0]
          print(row["package_id"], row["version"])
          PY
          )"

          package_root="$XDG_DATA_HOME/cifereca/plugins/packages/$package_id"
          version_root="$package_root/$package_version"
          test -d "$version_root"

          # Model an installed-but-inactive package using the package-store pointer
          # consumed by the production updater. The successful strict update must
          # preserve this state and replace the selected package contents.
          python - "$package_root/current.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          payload["active"] = None
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          printf 'must disappear on successful replace\n' > "$version_root/.p0-success-sentinel"
          mkdir -p "$XDG_DATA_HOME/cifereca"
          printf 'p0-user-data-integrity\n' > "$XDG_DATA_HOME/cifereca/.p0-user-data"
          data_before="$(sha256sum "$XDG_DATA_HOME/cifereca/.p0-user-data" | awk '{print $1}')"

          "$CIFERECA_BIN_DIR/cifereca-update-dev" "$archive"             --require-plugins-only             --expected-sha256 "$digest"             --json > "$RUNNER_TEMP/cifereca-p0/success.json"
          test ! -e "$version_root/.p0-success-sentinel"
          python - "$package_root/current.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("active") is not None:
              raise SystemExit(f"inactive package was unexpectedly activated: {payload}")
          PY
          test "$(sha256sum "$XDG_DATA_HOME/cifereca/.p0-user-data" | awk '{print $1}')" = "$data_before"

          tree_digest() {
            python - "$1" <<'PY'
          import hashlib, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          h = hashlib.sha256()
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              h.update(path.relative_to(root).as_posix().encode())
              h.update(b"\0")
              h.update(path.read_bytes())
              h.update(b"\0")
          print(h.hexdigest())
          PY
          }

          # A mismatched target Core must fail before plugin backup/install.
          runtime="$(readlink -f "$CIFERECA_INSTALL_ROOT/current")"
          cp "$runtime/pyproject.toml" "$runtime/pyproject.toml.p0"
          cp "$runtime/VERSION" "$runtime/VERSION.p0"
          sed -i 's/^version = ".*"/version = "0.0.1"/' "$runtime/pyproject.toml"
          printf '0.0.1\n' > "$runtime/VERSION"
          before_incompatible="$(tree_digest "$package_root")"
          set +e
          "$CIFERECA_BIN_DIR/cifereca-update-dev" "$archive"             --require-plugins-only             --expected-sha256 "$digest"             --json > "$RUNNER_TEMP/cifereca-p0/incompatible.json" 2>&1
          incompatible_rc=$?
          set -e
          mv "$runtime/pyproject.toml.p0" "$runtime/pyproject.toml"
          mv "$runtime/VERSION.p0" "$runtime/VERSION"
          if [[ "$incompatible_rc" -eq 0 ]]; then
            echo "Incompatible installed Core unexpectedly accepted." >&2
            exit 1
          fi
          test "$(tree_digest "$package_root")" = "$before_incompatible"
          test "$(sha256sum "$XDG_DATA_HOME/cifereca/.p0-user-data" | awk '{print $1}')" = "$data_before"

          # Force only the post-install inventory smoke to fail. Package install
          # still runs through the real CLI, so automatic rollback must restore
          # exactly the pre-attempt package tree and keep user data intact.
          printf 'must return after rollback\n' > "$version_root/.p0-rollback-sentinel"
          before_rollback="$(tree_digest "$package_root")"
          cli="$runtime/.venv/bin/cifereca-cli"
          real_cli="$cli.p0-real"
          mv "$cli" "$real_cli"
          cat > "$cli" <<EOF
          #!/usr/bin/env bash
          if [[ "\${1:-}" == "plugin" && "\${2:-}" == "list" ]]; then
            echo "forced P0 post-install smoke failure" >&2
            exit 86
          fi
          exec "$real_cli" "\$@"
          EOF
          chmod +x "$cli"

          set +e
          "$CIFERECA_BIN_DIR/cifereca-update-dev" "$archive"             --require-plugins-only             --expected-sha256 "$digest"             --json > "$RUNNER_TEMP/cifereca-p0/rollback.json" 2>&1
          rollback_rc=$?
          set -e
          mv "$real_cli" "$cli"
          if [[ "$rollback_rc" -eq 0 ]]; then
            echo "Forced post-install smoke failure unexpectedly succeeded." >&2
            exit 1
          fi
          grep -q "smoke plugins" "$RUNNER_TEMP/cifereca-p0/rollback.json"
          test -f "$version_root/.p0-rollback-sentinel"
          test "$(tree_digest "$package_root")" = "$before_rollback"
          test "$(sha256sum "$XDG_DATA_HOME/cifereca/.p0-user-data" | awk '{print $1}')" = "$data_before"

      - name: Attest plugins-only artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Published plugins-only release $RELEASE_TAG is immutable; refusing asset replacement." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --title "$RELEASE_TAG"               --draft
          else
            gh release create "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$RELEASE_TAG"               --generate-notes               --draft
          fi
          gh release upload "$RELEASE_TAG"             "${{ steps.build.outputs.archive }}"             "${{ steps.build.outputs.archive }}.sha256"             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Publish completed plugins-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
