name: Release plugins-only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag plugins-only (plugins-v<CORE_VERSION>-<SERIAL>)"
        required: true
        type: string
      package_ids:
        description: "Comma-separated package IDs to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: plugins-only-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGE_IDS: ${{ inputs.package_ids }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and validate plugins-only tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Official plugins-only releases must be dispatched from main." >&2
            exit 1
          fi
          git fetch --tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not integrated into main." >&2
            exit 1
          }
          version="$(tr -d '[:space:]' < VERSION)"
          prefix="plugins-v${version}-"
          if [[ "$RELEASE_TAG" != "$prefix"* || "$RELEASE_TAG" == "$prefix" ]]; then
            echo "Tag must match ${prefix}<serial>; got $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $RELEASE_TAG points to $target, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check             "setuptools>=69" wheel "pytest>=8,<9"             "packaging>=24,<26" "httpx>=0.28.1,<0.29"

      - name: Validate packaging and updater regressions
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release
          python -m pytest -q tests/test_dev_partial_plugin_updates.py

      - name: Build selected official plugins-only snapshot
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.package_partial_plugins             --packages "$PACKAGE_IDS"             --id "$RELEASE_TAG"             --out dist
          archive="dist/$RELEASE_TAG.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Verify compatibility and strict updater preflight
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          python -m scripts.package_partial_plugins --verify "$archive"
          (cd dist && sha256sum -c "$RELEASE_TAG.zip.sha256")

          python -m pip install --no-deps --no-build-isolation .
          core_version="$(python -c 'import cifereca; print(cifereca.__version__)')"
          api_version="$(python -c 'from cifereca.plugin_api.version import PLUGIN_API_VERSION; print(PLUGIN_API_VERSION)')"

          python -m scripts.package_partial_plugins --verify "$archive"             --target-core-version "$core_version"             --target-plugin-api-version "$api_version"

          if python -m scripts.package_partial_plugins --verify "$archive"               --target-core-version "9999.0.0"               --target-plugin-api-version "$api_version"; then
            echo "Incompatible Core unexpectedly accepted." >&2
            exit 1
          fi

          if ! cifereca-update-dev --help | grep -q -- '--require-plugins-only'; then
            echo "Strict plugins-only updater support is required; merge P0 #849 first." >&2
            exit 1
          fi

          digest="$(sha256sum "$archive" | awk '{print $1}')"
          cifereca-update-dev "$archive"             --require-plugins-only             --expected-sha256 "$digest"             --dry-run             --json

      - name: Attest plugins-only artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --title "$RELEASE_TAG"               --draft
          else
            gh release create "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$RELEASE_TAG"               --generate-notes               --draft
          fi
          gh release upload "$RELEASE_TAG"             "${{ steps.build.outputs.archive }}"             "${{ steps.build.outputs.archive }}.sha256"             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Publish completed plugins-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
