name: Restore Core tests step 1A5

on:
  push:
    branches:
      - rationalization/core-tests-step1a5
    paths:
      - '.restore-tests-step1a5/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .restore-tests-step1a5 -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 3
          cat .restore-tests-step1a5/payload.b64.part.* | base64 -d > /tmp/core-tests-step1a5.tar.xz
          echo "8a492e3593bd138b17231e540fbd072cc505e0a9fec758e5f923774ebe4c7b13  /tmp/core-tests-step1a5.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a5.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_core044_performance.py             tests/test_core_0911.py             tests/test_core_0913.py             tests/test_core_0915.py             tests/test_settings_migration_099_dev2.py

          rm -rf .restore-tests-step1a5
          rm -f .github/workflows/restore-core-tests-step1a5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A5'
          git push origin HEAD:rationalization/core-tests-step1a5
