name: Test plugins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plugins/**'
      - 'src/cifereca/**'
      - '!src/cifereca/gui/**'
      - '!src/cifereca/builtin_ui/**'
      - '!src/cifereca/app.py'
      - 'pyproject.toml'
      - 'VERSION'
      - 'scripts/ci-run-plugin-tests.sh'
      - 'scripts/validate_plugin_contract.py'
      - 'scripts/ci_select_plugin_tests.py'
      - 'tests/test_ci_plugin_selection.py'
      - '.github/plugin-test-dependencies.json'
      - '.github/workflows/plugin-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select affected plugin tests
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/ci_select_plugin_tests.py
          --event "$GITHUB_EVENT_NAME" --base "$BEFORE_SHA" --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.plugin_mode != 'skip'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        if: steps.scope.outputs.plugin_mode != 'skip'
        shell: bash
        env:
          PLUGIN_TARGETS: ${{ steps.scope.outputs.plugin_targets }}
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9" "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12"
          # No PDF engine is required for packages other than epub_optimizer.
          # Empty targets mean exhaustive tests: retain every dependency.
          if [[ -z "$PLUGIN_TARGETS" || " $PLUGIN_TARGETS " == *" src/plugins/epub_optimizer "* ]]; then
            python -m pip install --disable-pip-version-check "PyMuPDF>=1.26,<2"
          fi

      - name: Run plugin tests
        if: steps.scope.outputs.plugin_mode != 'skip'
        env:
          CIFERECA_PLUGIN_TEST_JOBS: "3"
          PYTHONPATH: ${{ github.workspace }}/src
          PLUGIN_TARGETS: ${{ steps.scope.outputs.plugin_targets }}
        shell: bash
        run: |
          if [[ -n "$PLUGIN_TARGETS" ]]; then
            read -r -a targets <<< "$PLUGIN_TARGETS"
            bash scripts/ci-run-plugin-tests.sh "${targets[@]}"
          else
            bash scripts/ci-run-plugin-tests.sh
          fi
