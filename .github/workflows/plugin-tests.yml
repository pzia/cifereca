name: Test plugins

on:
  push:
    paths:
      - "src/plugins/**"
      - "src/cifereca/**"
      - "pyproject.toml"
      - ".github/workflows/plugin-tests.yml"
  pull_request:
    paths:
      - "src/plugins/**"
      - "src/cifereca/**"
      - "pyproject.toml"
      - ".github/workflows/plugin-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12" "PyMuPDF>=1.26,<2"

      - name: Run plugin tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: bash scripts/ci-run-plugin-tests.sh
