name: Restore Core tests step 1A9

on:
  push:
    branches:
      - rationalization/core-tests-step1a9
    paths:
      - '.restore-tests-step1a9/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          cp .restore-tests-step1a9/payload.tar.xz /tmp/core-tests-step1a9.tar.xz
          echo "32b1bc1134c196ac917925af5d277e25526978e9858e597f582b75467b22c8e0  /tmp/core-tests-step1a9.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a9.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_core_0917.py             tests/test_core_0921.py             tests/test_core_0923.py             tests/test_core_0925.py

          rm -rf .restore-tests-step1a9
          rm -f .github/workflows/restore-core-tests-step1a9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A9'
          git push origin HEAD:rationalization/core-tests-step1a9
