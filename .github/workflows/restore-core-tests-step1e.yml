name: Restore Core tests step 1E

on:
  push:
    branches:
      - rationalization/core-tests-step1e
    paths:
      - '.restore-tests-step1e/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .restore-tests-step1e -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 5
          cat .restore-tests-step1e/payload.b64.part.* | base64 -d > /tmp/core-tests-step1e.tar.xz
          echo "3295dc0f40c358e150635024a63d26e3f8d25713fc91b874c2c37d8333834691  /tmp/core-tests-step1e.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1e.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 120s python -m pytest -q             tests/test_core044_performance.py             tests/test_core_0911.py             tests/test_core_0913.py             tests/test_core_0915.py             tests/test_core_0919.py             tests/test_core_iteration_097_dev3.py             tests/test_settings_migration_099_dev2.py             tests/test_updater.py             tests/test_history_covers.py             tests/test_login_retry.py             tests/test_normalize.py             tests/test_identities_081.py

          rm -rf .restore-tests-step1e
          rm -f .github/workflows/restore-core-tests-step1e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1E'
          git push origin HEAD:rationalization/core-tests-step1e
