name: Validate Core tests step 1A8 rebased

on:
  push:
    branches:
      - rationalization/core-tests-step1a8-rebased
    paths:
      - '.validate-step1a8/READY'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate rebased Core tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_cifereca_step_a.py             tests/test_cifereca_step_b.py             tests/test_install_helpers_097.py             tests/test_plugin_cards_097_dev4.py
          rm -rf .validate-step1a8
          rm -f .github/workflows/validate-core-tests-step1a8-rebased.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary step 1A8 validation workflow'
          git push origin HEAD:rationalization/core-tests-step1a8-rebased
