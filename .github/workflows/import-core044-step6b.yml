name: Import Core044 runtime step 6B

on:
  push:
    branches:
      - migration/core044-runtime-step6b
    paths:
      - '.migration-step6b/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore runtime and service layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .migration-step6b -maxdepth 1 -type f -name 'payload.xz.b64.part.*' | wc -l)" -eq 14
          cat .migration-step6b/payload.xz.b64.part.* | base64 -d > /tmp/step6b-runtime.tar.xz
          echo "c62fbfb7216208a887db0d26e8f8e8b5e9455011a5ab7d199a0fb734e9847f05  /tmp/step6b-runtime.tar.xz" | sha256sum -c -
          tar -xJf /tmp/step6b-runtime.tar.xz -C .
          python -m compileall -q src/cifereca
          python -m pip install -q httpx
          PYTHONPATH=src python -c 'import cifereca.core; from cifereca.core import CiferecaCore, LocalLibrarySearch, MaterializationCoordinator; print("core-import-ok", CiferecaCore.__name__, LocalLibrarySearch.__name__, MaterializationCoordinator.__name__)'
          rm -rf .migration-step6b
          rm -f .github/workflows/import-core044-step6b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Core044 runtime and service layer'
          git push origin HEAD:migration/core044-runtime-step6b
