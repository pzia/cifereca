name: Import Core044 runtime step 6B

on:
  push:
    branches:
      - migration/core044-runtime-step6b
    paths:
      - '.migration-step6b/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore runtime and service layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .migration-step6b -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 4
          cat .migration-step6b/payload.b64.part.* | base64 -d > /tmp/step6b-runtime.tar.gz
          echo "ae91b9cabe569dd9cd759d8d102a2e277a0c32e3232da1a1c9c0a8d6227e5ec7  /tmp/step6b-runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/step6b-runtime.tar.gz -C .
          python -m compileall -q src/cifereca
          python -m pip install -q httpx
          PYTHONPATH=src python - <<'PY'
          import cifereca.core
          from cifereca.core import CiferecaCore, LocalLibrarySearch, MaterializationCoordinator
          print("core-import-ok", CiferecaCore.__name__, LocalLibrarySearch.__name__, MaterializationCoordinator.__name__)
          PY
          rm -rf .migration-step6b
          rm -f .github/workflows/import-core044-step6b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Core044 runtime and service layer'
          git push origin HEAD:migration/core044-runtime-step6b
