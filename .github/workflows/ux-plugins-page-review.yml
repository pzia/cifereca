name: UX Plugins page review

on:
  push:
    branches:
      - ux/plugins-page-review-20261008
    paths:
      - ".github/workflows/ux-plugins-page-review.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-plugins-page
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install GTK/X11 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxtst6 \
            python3-gi python3-gi-cairo python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-httpx python3-packaging

      - name: Prepare isolated plugin inventory
        shell: bash
        run: |
          set -euxo pipefail
          cat > simulation/profiles/ux-plugins-page.toml <<'EOF'
          name = "ux-plugins-page"
          description = "Review UX page Plugins"

          [runtime]
          startup_timeout_seconds = 20

          [cifereca]
          binary = "cifereca"
          no_plugins = false
          width = 1366
          height = 768

          [library]
          epubs = 0
          seed = 20261008
          identity_dir = "ux"
          provider_dir = "local"
          EOF

          python3 simulation/datasetctl.py rebuild ux-plugins-page

          store="$CIFERECA_DATASET_RUNTIME/ux-plugins-page/xdg/data/cifereca/plugins/packages"
          mkdir -p "$store"
          python3 - "$store" <<'PY'
          from pathlib import Path
          import json, shutil, sys

          store = Path(sys.argv[1])
          sources = [
              "provider-kobo",
              "provider-gallica",
              "provider-gutenberg",
              "provider-bnf-catalogue",
              "provider-paris",
              "provider-numilog",
              "ebooksgratuits",
              "recommendations",
              "home-page",
              "diagnostics-page",
              "maintenance-library-audit",
              "epub_optimizer",
              "transport-http",
          ]
          for name in sources:
              src = Path("src/plugins") / name
              manifest = json.loads((src / "cifereca-plugin.json").read_text())
              package = manifest["package"]
              package_id = package["id"]
              version = package["version"]
              root = store / package_id
              target = root / version
              shutil.copytree(src, target, dirs_exist_ok=True)
              root.mkdir(parents=True, exist_ok=True)
              (root / "current.json").write_text(
                  json.dumps({"active": version, "previous": None}, indent=2) + "\n"
              )
          PY

          # UX-only runtime patch: open the real Plugins page immediately.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/cifereca/gui/main_window.py")
          text = path.read_text()
          old = '        self.navigate("dashboard")\n        return root\n'
          new = '        self.navigate("plugins")\n        return root\n'
          if old not in text:
              raise SystemExit("initial navigation anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Write capture driver
        shell: bash
        run: |
          cat > /tmp/capture_plugins.py <<'PY'
          import argparse
          import ctypes as C
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          from PIL import ImageGrab

          sys.path.insert(0, str(Path.cwd() / "environnements" / "openai-chat-debian"))
          from x11_input import X11Input

          def capture(path):
              image = ImageGrab.grab(xdisplay=os.environ["DISPLAY"])
              image.save(path)
              return list(image.getbbox() or ())

          def resize(control, width, height):
              x11=control.x11; display=control.display
              x11.XDefaultRootWindow.argtypes=[C.c_void_p]
              x11.XDefaultRootWindow.restype=C.c_ulong
              x11.XQueryTree.argtypes=[C.c_void_p,C.c_ulong,C.POINTER(C.c_ulong),C.POINTER(C.c_ulong),C.POINTER(C.POINTER(C.c_ulong)),C.POINTER(C.c_uint)]
              x11.XQueryTree.restype=C.c_int
              x11.XGetGeometry.argtypes=[C.c_void_p,C.c_ulong,C.POINTER(C.c_ulong),C.POINTER(C.c_int),C.POINTER(C.c_int),C.POINTER(C.c_uint),C.POINTER(C.c_uint),C.POINTER(C.c_uint),C.POINTER(C.c_uint)]
              x11.XGetGeometry.restype=C.c_int
              x11.XMoveResizeWindow.argtypes=[C.c_void_p,C.c_ulong,C.c_int,C.c_int,C.c_uint,C.c_uint]
              x11.XFree.argtypes=[C.c_void_p]
              root=x11.XDefaultRootWindow(display)
              rr=C.c_ulong(); pr=C.c_ulong(); children=C.POINTER(C.c_ulong)(); n=C.c_uint()
              if not x11.XQueryTree(display,root,C.byref(rr),C.byref(pr),C.byref(children),C.byref(n)):
                  return None
              best=None
              try:
                  for idx in range(n.value):
                      xid=children[idx]; gr=C.c_ulong(); x=C.c_int(); y=C.c_int(); w=C.c_uint(); h=C.c_uint(); b=C.c_uint(); d=C.c_uint()
                      if not x11.XGetGeometry(display,xid,C.byref(gr),C.byref(x),C.byref(y),C.byref(w),C.byref(h),C.byref(b),C.byref(d)):
                          continue
                      area=int(w.value)*int(h.value)
                      if w.value>=300 and h.value>=300 and (best is None or area>best[0]):
                          best=(area,int(xid),int(w.value),int(h.value))
                  if best is None:
                      return None
                  _,xid,bw,bh=best
                  x11.XMoveResizeWindow(display,xid,0,0,width,height); x11.XSync(display,False); time.sleep(.8)
                  return {"before":[bw,bh],"requested":[width,height],"xid":xid}
              finally:
                  if children: x11.XFree(children)

          def wheel(control, x, y, steps):
              control.xtst.XTestFakeMotionEvent(control.display,-1,x,y,0)
              for _ in range(steps):
                  control.xtst.XTestFakeButtonEvent(control.display,5,True,0)
                  control.xtst.XTestFakeButtonEvent(control.display,5,False,0)
              control.x11.XSync(control.display,False)

          ap=argparse.ArgumentParser()
          ap.add_argument("--width",type=int,required=True)
          ap.add_argument("--height",type=int,default=768)
          ap.add_argument("--out",type=Path,required=True)
          args=ap.parse_args()
          args.out.mkdir(parents=True,exist_ok=True)

          stdout=(args.out/"cifereca.stdout.log").open("w")
          stderr=(args.out/"cifereca.stderr.log").open("w")
          proc=subprocess.Popen(
              ["/usr/bin/python3","-m","cifereca","--verbose"],
              cwd=Path.cwd(), env=os.environ.copy(), stdout=stdout, stderr=stderr, text=True
          )
          control=None
          try:
              time.sleep(7)
              if proc.poll() is not None:
                  raise RuntimeError(f"cifereca stopped rc={proc.returncode}")
              control=X11Input()
              native=resize(control,args.width,args.height)
              time.sleep(2)
              shots={}
              shots["top"]={"path":str(args.out/"01-top.png"),"bbox":capture(args.out/"01-top.png")}
              wheel(control,int(args.width*.70),int(args.height*.72),12)
              time.sleep(1)
              shots["middle"]={"path":str(args.out/"02-middle.png"),"bbox":capture(args.out/"02-middle.png")}
              wheel(control,int(args.width*.70),int(args.height*.72),22)
              time.sleep(1)
              shots["bottom"]={"path":str(args.out/"03-bottom.png"),"bbox":capture(args.out/"03-bottom.png")}
              (args.out/"report.json").write_text(json.dumps({"native_resize":native,"shots":shots},indent=2)+"\n")
          finally:
              if control:
                  try:
                      control.key("Control_L",True); control.key("q",True); control.key("q",False); control.key("Control_L",False)
                  except Exception:
                      pass
                  control.close()
              try: proc.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  proc.terminate()
                  try: proc.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      proc.kill(); proc.wait()
              stdout.close(); stderr.close()
          PY

      - name: Capture Plugins page
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p plugins-page-evidence
          for width in 1024 1366; do
            python3 simulation/datasetctl.py exec ux-plugins-page -- \
              env PYTHONPATH="$GITHUB_WORKSPACE/src" GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none NO_AT_BRIDGE=1 \
              xvfb-run -a -s "-screen 0 ${width}x768x24" \
              /usr/bin/python3 /tmp/capture_plugins.py \
                --width "$width" --height 768 --out "$GITHUB_WORKSPACE/plugins-page-evidence/$width"
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-plugins-page-review
          path: plugins-page-evidence/
          if-no-files-found: error
          retention-days: 2
