name: Dataset UX harness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-datasets

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install simulation contract dependencies
        run: python -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26"

      - name: Compile dataset tools
        run: python -m compileall -q simulation

      - name: Test dataset harness
        run: python -m unittest discover -s simulation/tests -v

      - name: Start small UX profile
        run: python simulation/datasetctl.py up ux-small

      - name: Check service health
        run: python simulation/datasetctl.py status ux-small

      - name: Show generated config
        run: python simulation/datasetctl.py config ux-small

      - name: Stop small UX profile
        if: always()
        run: python simulation/datasetctl.py down ux-small
