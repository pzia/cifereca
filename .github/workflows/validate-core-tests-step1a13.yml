name: Restore Core tests step 1A13

on:
  push:
    branches:
      - rationalization/core-tests-step1a13
    paths:
      - '.validate-step1a13/READY'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shell controls regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q tests/test_shell_controls_097_dev5.py

          rm -rf .validate-step1a13
          rm -f .github/workflows/validate-core-tests-step1a13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary shell controls validation workflow'
          git push origin HEAD:rationalization/core-tests-step1a13
