name: E2E Smoke

on:
  pull_request:
    paths:
      - "e2e/**"
      - "src/cifereca/**"
      - "environnements/openai-chat-debian/capture_app.py"
      - ".github/workflows/e2e-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "e2e/**"
      - "src/cifereca/**"
      - "environnements/openai-chat-debian/capture_app.py"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  startup:
    name: E2E GTK · core
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install GTK E2E runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 libxtst6 \
            python3-gi python3-gi-cairo python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-httpx python3-packaging

      - name: Run reference E2E
        env:
          CIFERECA_E2E_PYTHON: /usr/bin/python3
        run: dbus-run-session -- /usr/bin/python3 e2e/run.py --plugin core

      - name: Publish E2E summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E GTK"
            echo
            if [ -f e2e-artifacts/summary.json ]; then
              echo '~~~json'
              cat e2e-artifacts/summary.json
              echo '~~~'
            else
              echo "Aucun résumé produit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-debug
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
