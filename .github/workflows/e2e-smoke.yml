name: E2E Smoke

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Exact scenario ID from e2e/run.py. Leave empty to run the full smoke suite.'
        required: false
        type: string
      performance_campaign:
        description: 'Run isolated synthetic baseline campaign (no performance verdict).'
        required: false
        type: boolean
        default: false
  # Integrated main reception: every path that requires PR GTK E2E also
  # requires a full replay after merge. Keep both lists in sync via tests.
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'src/cifereca/gui/**'
      - 'src/cifereca/plugin_api/**'
      - 'src/cifereca/brokers.py'
      - 'src/cifereca/core/source_materialization.py'
      - 'src/cifereca/core/search_orchestration.py'
      - 'src/cifereca/core/notice_c_loaded_filter.py'
      - 'src/cifereca/core/notice_c_authenticated_web_choices.py'
      - 'src/cifereca/core/notice_c_private_search_web.py'
      - 'src/cifereca/core/notice_c_web_choices.py'
      - 'src/cifereca/core/notice_c_combined_web_choices.py'
      - 'src/cifereca/core/borrow_for_identity_native_*.py'
      - 'src/cifereca/core/borrow_for_identity_normal_executor.py'
      - 'src/cifereca/core/numilog_materialization_startup.py'
      - 'src/cifereca/core/numilog_materialization_checkpoint.py'
      - 'src/cifereca/core/selected_owned_search.py'
      - 'src/cifereca/core/selected_source_offer.py'
      - 'src/cifereca/core/explicit_owned_canonical.py'
      - 'src/cifereca/core/loan_local_preparation.py'
      - 'src/cifereca/core/provider_loan_renewal.py'
      - 'src/cifereca/core/loan_provider_delivery.py'
      - 'src/cifereca/core/device_usb_discovery.py'
      - 'src/cifereca/core/device_usb_mount.py'
      - 'src/cifereca/core/device_usb_binding_proposal.py'
      - 'src/cifereca/core/manual_acsm_import.py'
      - 'src/cifereca/core/diagnostic_numilog_projection.py'
      - 'src/cifereca/core/sync_coordination.py'
      - 'src/cifereca/builtin_ui/**'
      - 'src/cifereca/app.py'
      - 'src/plugins/diagnostics-page/**'
      - 'src/plugins/home-page/**'
      - 'src/plugins/constellations/**'
      - 'src/plugins/recommendations/**'
      - 'src/plugins/provider-bnf-pret/cifereca_bnf_pret.py'
      - 'src/plugins/provider-bnf-pret/cifereca_bnf_pret_web.py'
      - 'scripts/ci-install-gtk-e2e-runtime.sh'
      - 'scripts/ci-export-e2e-summary.py'
      - 'scripts/ci-select-e2e.py'
      - 'scripts/ci-select-core-tests.py'
      - 'environnements/openai-chat-debian/capture_app.py'
      - '.github/workflows/e2e-smoke.yml'
      - 'pyproject.toml'
      - 'tests/test_e2e_runner_contract.py'
      - 'tests/test_ci_e2e_artifact_export.py'
      - 'tests/test_e2e_ci_paths.py'
      - 'tests/test_ci_select_e2e.py'
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/cifereca/gui/**'
      - 'src/cifereca/plugin_api/**'
      - 'src/cifereca/brokers.py'
      - 'src/cifereca/core/source_materialization.py'
      - 'src/cifereca/core/search_orchestration.py'
      - 'src/cifereca/core/notice_c_loaded_filter.py'
      - 'src/cifereca/core/notice_c_authenticated_web_choices.py'
      - 'src/cifereca/core/notice_c_private_search_web.py'
      - 'src/cifereca/core/notice_c_web_choices.py'
      - 'src/cifereca/core/notice_c_combined_web_choices.py'
      - 'src/cifereca/core/borrow_for_identity_native_*.py'
      - 'src/cifereca/core/borrow_for_identity_normal_executor.py'
      - 'src/cifereca/core/numilog_materialization_startup.py'
      - 'src/cifereca/core/numilog_materialization_checkpoint.py'
      - 'src/cifereca/core/selected_owned_search.py'
      - 'src/cifereca/core/selected_source_offer.py'
      - 'src/cifereca/core/explicit_owned_canonical.py'
      - 'src/cifereca/core/loan_local_preparation.py'
      - 'src/cifereca/core/provider_loan_renewal.py'
      - 'src/cifereca/core/loan_provider_delivery.py'
      - 'src/cifereca/core/device_usb_discovery.py'
      - 'src/cifereca/core/device_usb_mount.py'
      - 'src/cifereca/core/device_usb_binding_proposal.py'
      - 'src/cifereca/core/manual_acsm_import.py'
      - 'src/cifereca/core/diagnostic_numilog_projection.py'
      - 'src/cifereca/core/sync_coordination.py'
      - 'src/cifereca/builtin_ui/**'
      - 'src/cifereca/app.py'
      - 'src/plugins/diagnostics-page/**'
      - 'src/plugins/home-page/**'
      - 'src/plugins/constellations/**'
      - 'src/plugins/recommendations/**'
      - 'src/plugins/provider-bnf-pret/cifereca_bnf_pret.py'
      - 'src/plugins/provider-bnf-pret/cifereca_bnf_pret_web.py'
      - 'scripts/ci-install-gtk-e2e-runtime.sh'
      - 'scripts/ci-export-e2e-summary.py'
      - 'scripts/ci-select-e2e.py'
      - 'scripts/ci-select-core-tests.py'
      - 'environnements/openai-chat-debian/capture_app.py'
      - '.github/workflows/e2e-smoke.yml'
      - 'pyproject.toml'
      - 'tests/test_e2e_runner_contract.py'
      - 'tests/test_ci_e2e_artifact_export.py'
      - 'tests/test_e2e_ci_paths.py'
      - 'tests/test_ci_select_e2e.py'

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'gate' }}
  cancel-in-progress: true

jobs:
  # Preserve the existing required-check name. It becomes green only when
  # ALL selected GTK shards completed successfully; cancelled/failed/skipped
  # shards cannot be disguised by a successful sibling.
  startup:
    name: E2E GTK · core
    needs: [gtk_shards, synthetic_notice_matrix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every GTK shard to pass
        shell: bash
        env:
          SHARDS_RESULT: ${{ needs.gtk_shards.result }}
          MATRIX_RESULT: ${{ needs.synthetic_notice_matrix.result }}
        run: |
          set -euo pipefail
          test "$SHARDS_RESULT" = "success"
          test "$MATRIX_RESULT" = "success"

  gtk_shards:
    name: E2E GTK · shard ${{ matrix.shard }}
    # Independent isolated runners, workspaces, D-Bus and Xvfb: a failure in
    # one shard must not cancel coverage in the others. Full = 54/54, not an
    # exclusion/skip; shards partition the selector's ordered scenario list.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select impacted GTK/XTEST scenarios
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_SCENARIO: ${{ inputs.scenario }}
          E2E_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            if [[ -n "$MANUAL_SCENARIO" ]]; then
              /usr/bin/python3 scripts/ci-select-e2e.py --scenario "$MANUAL_SCENARIO" --github-output "$GITHUB_OUTPUT" --shard-count 3 --shard-index "$E2E_SHARD_INDEX"
            else
              /usr/bin/python3 scripts/ci-select-e2e.py --full --github-output "$GITHUB_OUTPUT" --shard-count 3 --shard-index "$E2E_SHARD_INDEX"
            fi
          else
            # Compare PR-owned changes from the merge base, not unrelated commits on main.
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/e2e-changed-files"
            /usr/bin/python3 scripts/ci-select-e2e.py --changed-files "$RUNNER_TEMP/e2e-changed-files" --github-output "$GITHUB_OUTPUT" --shard-count 3 --shard-index "$E2E_SHARD_INDEX"
          fi

      - name: Test E2E scenario selector
        run: /usr/bin/python3 tests/test_ci_select_e2e.py

      - name: Validate privacy-safe E2E publication policy
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_ci_e2e_artifact_export.py'

      - name: Install GTK E2E runtime
        if: steps.select.outputs.count != '0'
        run: bash scripts/ci-install-gtk-e2e-runtime.sh

      - name: Prepare isolated E2E Python with plugin dependencies
        if: steps.select.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/cifereca-e2e-venv"
          "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26"
          "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" - <<'PY'
          import importlib.metadata
          import gi
          from packaging.specifiers import SpecifierSet
          import httpx
          from gi.repository import Gtk
          assert importlib.metadata.version("httpx") in SpecifierSet(">=0.28.1,<0.29")
          assert Gtk is not None and httpx is not None
          PY

      # #2435: same 16/256 corpus and callback assertions as PR CI, but
      # require the native decoder in the existing GTK environment.
      - name: Measure native GdkPixbuf preview cache
        if: contains(steps.select.outputs.scenarios, 'book-detail-1366')
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" -m tests.test_core_p0_2435_preview_baseline

      # #6939: exercise the real desktop lifecycle adapter while an
      # actual journal scan is deliberately blocked on a worker.
      - name: Verify native GTK documentary runtime responsiveness
        if: steps.select.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" e2e/notice_work_heartbeat_contract.py

      - name: Replay impacted GTK/XTEST scenarios
        if: steps.select.outputs.count != '0'
        shell: bash
        env:
          E2E_SCENARIOS: ${{ steps.select.outputs.scenarios }}
          CIFERECA_E2E_PYTHON: ${{ runner.temp }}/cifereca-e2e-venv/bin/python
        run: |
          set -euo pipefail
          status=0
          # Preserve the failing gate, but finish independent GTK scenarios:
          # a flaky baseline must not erase #2027 Maintenance diagnostics.
          dbus-run-session -- bash -c '
            failed=0
            for scenario in $E2E_SCENARIOS; do
              echo "::group::GTK/XTEST $scenario"
              if /usr/bin/python3 e2e/run.py --scenario "$scenario" --out "e2e-artifacts/$scenario"; then
                echo "CIFERECA_E2E_VERDICT:PASS:$scenario"
              else
                echo "CIFERECA_E2E_VERDICT:FAIL:$scenario"
                failed=1
              fi
              echo "::endgroup::"
            done
            exit "$failed"
          ' || status=$?
          # Keep each scenario's logs/screenshots and publish a combined summary.
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("e2e-artifacts")
          results = []
          for path in sorted(root.glob("*/summary.json")):
              results.extend(json.loads(path.read_text(encoding="utf-8")))
          root.mkdir(exist_ok=True)
          (root / "summary.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          exit "$status"

      - name: Prepare privacy-safe E2E verdicts
        if: always()
        shell: bash
        run: |
          if [ -f e2e-artifacts/summary.json ]; then
            /usr/bin/python3 scripts/ci-export-e2e-summary.py \
              --source e2e-artifacts/summary.json \
              --out-dir "$RUNNER_TEMP/cifereca-e2e-public"
          fi

      - name: Publish privacy-safe E2E summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E GTK"
            echo "Selected: ${{ steps.select.outputs.count }}/${{ steps.select.outputs.total }} (mode: ${{ steps.select.outputs.mode }})"
            echo
            if [ -f "$RUNNER_TEMP/cifereca-e2e-public/summary.json" ]; then
              echo '~~~json'
              cat "$RUNNER_TEMP/cifereca-e2e-public/summary.json"
              echo '~~~'
            else
              echo "Aucun verdict publiable (pas de scénario ou export refusé)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload privacy-safe E2E verdicts only
        if: always()
        # Test the reviewed v7 transport against recurring v6 upload failures.
        # This remains a required step; a publication failure still fails CI.
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-core-summary-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cifereca-e2e-public/summary.json
          if-no-files-found: ignore
          retention-days: 2

  synthetic_notice_matrix:
    name: GTK synthetic notice matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install GTK E2E runtime
        run: bash scripts/ci-install-gtk-e2e-runtime.sh
      - name: Prepare synthetic runtime
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/notice-matrix-venv"
          "$RUNNER_TEMP/notice-matrix-venv/bin/python" -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12"
      - name: Verify synthetic matrix at exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/notice-matrix-venv/bin/python"
          status=0
          dbus-run-session -- "$PY" e2e/notice_c_automated_receipt.py --python "$PY" --expected-sha "$EXPECTED_SHA" > "$RUNNER_TEMP/notice-matrix-receipt.json" || status=$?
          cat "$RUNNER_TEMP/notice-matrix-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notice-matrix-receipt.json"
          exit "$status"
      - name: Upload closed synthetic receipt only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notice-matrix-receipt
          path: ${{ runner.temp }}/notice-matrix-receipt.json
          if-no-files-found: error
          retention-days: 2

  # Explicit one-PR pilot, plus manual dispatch for subsequent measurements.
  # No dependency from the existing required gate to this optional job.
  performance_campaign:
    name: GTK synthetic performance baseline
    needs: [startup]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.performance_campaign) || (github.event_name == 'pull_request' && github.event.pull_request.number == 8473 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'coreui/p0-8459-1741-warm-baseline') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install GTK E2E runtime
        run: bash scripts/ci-install-gtk-e2e-runtime.sh
      - name: Prepare isolated campaign runtime
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/perf-venv"
          "$RUNNER_TEMP/perf-venv/bin/python" -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12"
      - name: Execute both widths sequentially at exact SHA
        env:
          CIFERECA_PERF_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CIFERECA_PERF_EXPECTED_SHA"
          status=0
          for width in 1366 1600; do
            out="$RUNNER_TEMP/perf-private-$width"
            dbus-run-session -- "$RUNNER_TEMP/perf-venv/bin/python" e2e/diagnostics_navigation_probe.py --width "$width" --out "$out" --performance-campaign --ci-synthetic-campaign >/dev/null 2>&1 || status=1
            if test -f "$out/numeric-receipt.json"; then
              mkdir -p "$RUNNER_TEMP/perf-public"
              cp "$out/numeric-receipt.json" "$RUNNER_TEMP/perf-public/receipt-$width.json"
              cat "$RUNNER_TEMP/perf-public/receipt-$width.json"
            else
              echo "CIFERECA_PERF_RECEIPT_MISSING:$width"
              status=1
            fi
          done
          exit "$status"
      - name: Upload closed numeric baseline receipts only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-performance-receipts
          path: ${{ runner.temp }}/perf-public/receipt-*.json
          if-no-files-found: error
          retention-days: 2
