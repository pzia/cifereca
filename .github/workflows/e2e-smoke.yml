name: E2E Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/cifereca/gui/**'
      - 'src/cifereca/brokers.py'
      - 'src/cifereca/core/source_materialization.py'
      - 'src/cifereca/core/numilog_materialization_startup.py'
      - 'src/cifereca/core/numilog_materialization_checkpoint.py'
      - 'src/cifereca/core/numilog_direct_acquisition.py'
      - 'src/cifereca/core/loan_local_preparation.py'
      - 'src/cifereca/core/loan_provider_delivery.py'
      - 'src/cifereca/core/diagnostic_numilog_projection.py'
      - 'src/cifereca/core/sync_coordination.py'
      - 'src/cifereca/builtin_ui/**'
      - 'src/cifereca/app.py'
      - 'src/plugins/diagnostics-page/**'
      - 'src/plugins/home-page/**'
      - 'src/plugins/constellations/**'
      - 'src/plugins/recommendations/**'
      - 'scripts/ci-install-gtk-e2e-runtime.sh'
      - 'scripts/ci-export-e2e-summary.py'
      - 'scripts/ci-select-e2e.py'
      - 'scripts/ci-select-core-tests.py'
      - 'environnements/openai-chat-debian/capture_app.py'
      - '.github/workflows/e2e-smoke.yml'
      - 'pyproject.toml'
      - 'tests/test_e2e_runner_contract.py'
      - 'tests/test_ci_e2e_artifact_export.py'
      - 'tests/test_e2e_ci_paths.py'
      - 'tests/test_ci_select_e2e.py'

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: E2E GTK · core
    runs-on: ubuntu-24.04
    # Full impacted GTK replay is now up to 31 scenarios; 10 minutes
    # cancelled a valid PR gate before verdict (run #40403881704).
    # Keep a strict finite watchdog; do not skip or mask failed scenarios.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select impacted GTK/XTEST scenarios
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            /usr/bin/python3 scripts/ci-select-e2e.py --full --github-output "$GITHUB_OUTPUT"
          else
            # Compare PR-owned changes from the merge base, not unrelated commits on main.
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/e2e-changed-files"
            /usr/bin/python3 scripts/ci-select-e2e.py --changed-files "$RUNNER_TEMP/e2e-changed-files" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Test E2E scenario selector
        run: /usr/bin/python3 tests/test_ci_select_e2e.py

      - name: Validate privacy-safe E2E publication policy
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_ci_e2e_artifact_export.py'

      - name: Install GTK E2E runtime
        if: steps.select.outputs.count != '0'
        run: bash scripts/ci-install-gtk-e2e-runtime.sh

      - name: Prepare isolated E2E Python with plugin dependencies
        if: steps.select.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/cifereca-e2e-venv"
          "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26"
          "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" - <<'PY'
          import importlib.metadata
          import gi
          from packaging.specifiers import SpecifierSet
          import httpx
          from gi.repository import Gtk
          assert importlib.metadata.version("httpx") in SpecifierSet(">=0.28.1,<0.29")
          assert Gtk is not None and httpx is not None
          PY

      - name: Replay impacted GTK/XTEST scenarios
        if: steps.select.outputs.count != '0'
        shell: bash
        env:
          E2E_SCENARIOS: ${{ steps.select.outputs.scenarios }}
          CIFERECA_E2E_PYTHON: ${{ runner.temp }}/cifereca-e2e-venv/bin/python
        run: |
          set -euo pipefail
          status=0
          # Preserve the failing gate, but finish independent GTK scenarios:
          # a flaky baseline must not erase #2027 Maintenance diagnostics.
          dbus-run-session -- bash -c '
            failed=0
            for scenario in $E2E_SCENARIOS; do
              echo "::group::GTK/XTEST $scenario"
              if ! /usr/bin/python3 e2e/run.py --scenario "$scenario" --out "e2e-artifacts/$scenario"; then
                failed=1
              fi
              echo "::endgroup::"
            done
            exit "$failed"
          ' || status=$?
          # Keep each scenario's logs/screenshots and publish a combined summary.
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("e2e-artifacts")
          results = []
          for path in sorted(root.glob("*/summary.json")):
              results.extend(json.loads(path.read_text(encoding="utf-8")))
          root.mkdir(exist_ok=True)
          (root / "summary.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          exit "$status"

      - name: Prepare privacy-safe E2E verdicts
        if: always()
        shell: bash
        run: |
          if [ -f e2e-artifacts/summary.json ]; then
            /usr/bin/python3 scripts/ci-export-e2e-summary.py \
              --source e2e-artifacts/summary.json \
              --out-dir "$RUNNER_TEMP/cifereca-e2e-public"
          fi

      - name: Publish privacy-safe E2E summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E GTK"
            echo "Selected: ${{ steps.select.outputs.count }}/${{ steps.select.outputs.total }} (mode: ${{ steps.select.outputs.mode }})"
            echo
            if [ -f "$RUNNER_TEMP/cifereca-e2e-public/summary.json" ]; then
              echo '~~~json'
              cat "$RUNNER_TEMP/cifereca-e2e-public/summary.json"
              echo '~~~'
            else
              echo "Aucun verdict publiable (pas de scénario ou export refusé)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload privacy-safe E2E verdicts only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-core-summary
          path: ${{ runner.temp }}/cifereca-e2e-public/summary.json
          if-no-files-found: ignore
          retention-days: 2
