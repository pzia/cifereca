name: E2E Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/cifereca/gui/**'
      - 'src/plugins/youth-catalog/**'
      - 'src/plugins/youth-source-milan/**'
      - 'simulation/youth_sources/**'
      - 'simulation/milan/**'
      - 'scripts/ci-install-gtk-e2e-runtime.sh'
      - '.github/workflows/e2e-smoke.yml'
      - 'tests/test_e2e_runner_contract.py'

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: E2E GTK · core
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install GTK E2E runtime
        run: bash scripts/ci-install-gtk-e2e-runtime.sh

      - name: Prepare isolated E2E Python with plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/cifereca-e2e-venv"
          "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26"
          "$RUNNER_TEMP/cifereca-e2e-venv/bin/python" - <<'PY'
          import importlib.metadata
          import gi
          from packaging.specifiers import SpecifierSet
          import httpx
          from gi.repository import Gtk
          assert importlib.metadata.version("httpx") in SpecifierSet(">=0.28.1,<0.29")
          assert Gtk is not None and httpx is not None
          PY

      - name: Run reference E2E
        env:
          CIFERECA_E2E_PYTHON: ${{ runner.temp }}/cifereca-e2e-venv/bin/python
        run: dbus-run-session -- /usr/bin/python3 e2e/run.py --plugin core

      - name: Replay P0 Search filter regression on real GTK
        env:
          CIFERECA_E2E_PYTHON: ${{ runner.temp }}/cifereca-e2e-venv/bin/python
        run: dbus-run-session -- /usr/bin/python3 e2e/run.py --scenario search-filter-p0

      - name: Replay Diagnostics P0 widget on real GTK4 / XTEST
        if: ${{ !cancelled() }}
        env:
          CIFERECA_E2E_PYTHON: ${{ runner.temp }}/cifereca-e2e-venv/bin/python
        run: dbus-run-session -- /usr/bin/python3 e2e/run.py --scenario diagnostics-1366

      - name: Replay Jeunesse P1 in a real virtual GTK4 environment
        if: ${{ !cancelled() }}
        env:
          CIFERECA_E2E_PYTHON: ${{ runner.temp }}/cifereca-e2e-venv/bin/python
        run: dbus-run-session -- /usr/bin/python3 e2e/run.py --plugin catalog.youth --out e2e-artifacts/youth

      - name: Publish E2E summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E GTK"
            echo
            if [ -f e2e-artifacts/summary.json ]; then
              echo '~~~json'
              cat e2e-artifacts/summary.json
              echo '~~~'
            else
              echo "Aucun résumé produit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-debug
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
