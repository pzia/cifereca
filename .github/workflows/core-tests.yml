name: Test Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cifereca/**'
      - 'tests/**'
      - 'e2e/**'
      - 'environnements/openai-chat-debian/capture_app.py'
      - 'pyproject.toml'
      - 'VERSION'
      - 'scripts/ci-select-core-tests.py'
      - 'scripts/ci_select_plugin_tests.py'
      - '.github/plugin-test-dependencies.json'
      - 'scripts/check_release_inventory.py'
      - 'scripts/ci_core_release_preflight.py'
      - 'scripts/ci-install-gtk-e2e-runtime.sh'
      - 'scripts/package_partial_plugins.py'
      - 'scripts/plugin_packaging.py'
      - 'scripts/test_plugin_packaging.py'
      - 'scripts/package-dev-snapshot.py'
      - 'scripts/test_partial_plugin_release.py'
      - '.github/workflows/core-tests.yml'

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Core test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12" "cryptography>=42,<48"

      - name: Run Core tests
        run: python -m pytest -q --durations=10 tests
