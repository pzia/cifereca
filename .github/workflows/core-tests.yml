name: Test Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cifereca/**'
      - 'tests/**'
      - 'e2e/**'
      - 'environnements/openai-chat-debian/capture_app.py'
      - 'pyproject.toml'
      - 'VERSION'
      - 'scripts/ci-select-core-tests.py'
      - 'scripts/ci_test_dependency_guard.py'
      - 'scripts/ci_select_core_push.py'
      - 'scripts/ci_select_plugin_tests.py'
      - '.github/plugin-test-dependencies.json'
      - 'scripts/check_release_inventory.py'
      - 'scripts/ci_core_release_preflight.py'
      - 'scripts/ci-install-gtk-e2e-runtime.sh'
      - 'scripts/package_partial_plugins.py'
      - 'scripts/plugin_packaging.py'
      - 'scripts/test_plugin_packaging.py'
      - 'scripts/package-dev-snapshot.py'
      - 'scripts/test_partial_plugin_release.py'
      - '.github/workflows/core-tests.yml'

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Core targets (fail closed to full suite)
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci_select_core_push.py \
            --event "$GITHUB_EVENT_NAME" --before "$BEFORE_SHA" \
            --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Core test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12" "cryptography>=42,<48"

      - name: Run Core tests
        env:
          CORE_TEST_MODE: ${{ steps.scope.outputs.core_mode }}
          CORE_TEST_TARGETS: ${{ steps.scope.outputs.core_targets }}
        run: |
          echo "Core test scope: $CORE_TEST_MODE"
          read -r -a selected <<< "$CORE_TEST_TARGETS"
          if (( ${#selected[@]} == 0 )); then
            echo "Empty test selection: refusing to skip the Core suite" >&2
            exit 1
          fi
          python -m pytest -q --durations=10 "${selected[@]}"
