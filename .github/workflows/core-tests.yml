name: Test Core

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Core test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12"

      - name: Run Core tests
        run: python -m pytest -q --durations=10 tests
