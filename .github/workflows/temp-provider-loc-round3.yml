name: "TEMP provider LOC audit round 3"
on:
  pull_request:
    paths:
      - ".github/workflows/temp-provider-loc-round3.yml"
permissions:
  contents: read
jobs:
  provider-loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure provider LOC
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_provider_core_coupling_report.py --json > /tmp/provider-loc.json
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open('/tmp/provider-loc.json'))
          result={
            'sha':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'files':d['total_core_python_files'],
            'historic_provider':d['historical']['dedicated_by_provider'],
            'named':d['expanded_named_modules'],
            'named_other_files':d['vendor_named_modules_outside_legacy_dedicated_scope'],
            'generic':d['remaining_generic_after_expanded_named_scope'],
            'signal_by_provider_alias':d['generic_ast_signal_occurrences_by_provider_alias'],
            'top_generic':d['top_generic_by_ast_signal'][:12],
            'errors':d['historical']['parse_errors']
          }
          print('MEASURE_RESULT_BEGIN')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          print('MEASURE_RESULT_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-loc-full-report-round3
          path: /tmp/provider-loc.json
