name: Core UI 558 focused proof

on:
  push:
    branches:
      - coreui/558-contextual-narrow-detail
    paths:
      - ".github/workflows/coreui-558-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-558
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay UX recipe
        run: |
          git fetch origin ux/search-list-recipe
          git checkout origin/ux/search-list-recipe -- \
            simulation/datasetctl.py \
            simulation/profiles/ux-search-list.toml \
            simulation/recipes/search_list_fixture.py \
            simulation/recipes/search_list_capture.py

      - name: Install focused runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxtst6 python3-pytest \
            python3-gi python3-gi-cairo python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 python3-httpx python3-packaging

      - name: Run focused tests
        run: |
          /usr/bin/python3 -m pytest -q \
            tests/test_core_ui_553_master_detail_window_width.py \
            tests/test_core_ui_270_responsive_search_library.py

      - name: Prepare normal book
        run: |
          mkdir -p /tmp/cifereca-bin evidence-558/760
          cat > /tmp/cifereca-bin/cifereca <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/python3 -m cifereca "$@"
          EOF
          chmod +x /tmp/cifereca-bin/cifereca
          export PATH="/tmp/cifereca-bin:$PATH"
          /usr/bin/python3 simulation/datasetctl.py rebuild ux-search-list
          /usr/bin/python3 simulation/recipes/search_list_fixture.py
          /usr/bin/python3 simulation/datasetctl.py exec ux-search-list -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /usr/bin/python3 -m cifereca.cli catalog-scan

      - name: Capture 760 detail
        run: |
          export PATH="/tmp/cifereca-bin:$PATH"
          /usr/bin/python3 simulation/datasetctl.py exec ux-search-list -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" \
                GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none NO_AT_BRIDGE=1 \
            xvfb-run -a -s "-screen 0 760x720x24" \
              /usr/bin/python3 simulation/recipes/search_list_capture.py \
                --query "UXSTRESS normal" \
                --window-width 760 --window-height 720 \
                --startup-wait 5 --search-wait 4 \
                --out-dir "$GITHUB_WORKSPACE/evidence-558/760" \
                --cwd "$GITHUB_WORKSPACE" -- \
              /usr/bin/python3 simulation/datasetctl.py cifereca ux-search-list --verbose

      - name: Stop simulator
        if: always()
        run: /usr/bin/python3 simulation/datasetctl.py down ux-search-list || true

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreui-558-proof-v2
          path: evidence-558/
          if-no-files-found: error
          retention-days: 2
