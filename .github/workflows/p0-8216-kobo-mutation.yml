name: P0 8216 Kobo discriminating mutation
on:
  pull_request:
    paths:
      - '.github/workflows/p0-8216-kobo-mutation.yml'
permissions:
  contents: read
jobs:
  discriminate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4bd59b9a3b7d381c4761dee1f2267a6e637160a1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest httpx packaging Pillow PyMuPDF
      - shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/focus/8216-kobo-cover-oracle
          test "$(git rev-parse FETCH_HEAD)" = "e0740e300aa0e937088198a2770fc51ab6f9bcce"
          p=src/plugins/provider-kobo
          t="$p/tests/test_kobo_public_cover_url_p1.py"
          git show FETCH_HEAD:"$t" > "$RUNNER_TEMP/new.py"
          export PYTHONPATH="$PWD/src:$PWD/$p"
          run_test() { python -m pytest -q "$t" -k test_safe_nested_images_remain_usable_after_route_guard; }
          run_test
          cp "$t" "$RUNNER_TEMP/old.py"
          cp "$RUNNER_TEMP/new.py" "$t"
          run_test
          python - <<'PY'
          from pathlib import Path
          p = Path("src/plugins/provider-kobo/cifereca_kobo_catalog.py")
          s = p.read_text()
          old = "resolved = urljoin(self.client.base_url.rstrip('/') + '/', value)"
          new = "resolved = urljoin(self.client.base_url.rstrip('/') + '/', '/' + value if not raw.scheme and not raw.netloc and not value.startswith('/') else value)"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          cp "$RUNNER_TEMP/old.py" "$t"
          run_test
          cp "$RUNNER_TEMP/new.py" "$t"
          set +e
          run_test
          rc=$?
          set -e
          test "$rc" = 1
          echo "Old oracle survives; strengthened oracle kills relative-path mutant"
