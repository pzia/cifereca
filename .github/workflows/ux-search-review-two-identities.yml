name: UX search review two identities

on:
  push:
    branches:
      - ux/simulator-second-identity
    paths:
      - ".github/workflows/ux-search-review-two-identities.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-search-review
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/simulator-second-identity

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxtst6 \
            python3-gi python3-gi-cairo python3-cairo python3-pil python3-pytest \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-httpx python3-packaging

      - name: Validate simulator
        run: |
          /usr/bin/python3 -m pytest -q simulation/tests/test_datasetctl.py

      - name: Prepare ux-small
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/python3 simulation/datasetctl.py rebuild ux-small
          /usr/bin/python3 simulation/datasetctl.py summary ux-small --json > /tmp/summary.json
          /usr/bin/python3 simulation/datasetctl.py exec ux-small -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /usr/bin/python3 -m cifereca.cli catalog-scan \
            > /tmp/catalog-scan.json

      - name: Capture real Search journey
        shell: bash
        run: |
          cat > /tmp/search_review.py <<'PY'
          from __future__ import annotations
          import ctypes as C
          import json, os, subprocess, sys, time
          from pathlib import Path
          from PIL import ImageGrab

          ROOT=Path.cwd()
          sys.path.insert(0, str(ROOT/"environnements"/"openai-chat-debian"))
          from x11_input import X11Input

          OUT=ROOT/"search-review-evidence"
          OUT.mkdir(parents=True, exist_ok=True)
          WIDTH,HEIGHT=1366,768

          def capture(name):
              p=OUT/name
              ImageGrab.grab(xdisplay=os.environ["DISPLAY"]).save(p)
              return str(p)

          def shortcut(c, mod, key):
              c.key(mod,True)
              try:
                  c.key(key,True); c.key(key,False)
              finally:
                  c.key(mod,False)

          def resize(c):
              x11=c.x11; display=c.display
              x11.XDefaultRootWindow.argtypes=[C.c_void_p]; x11.XDefaultRootWindow.restype=C.c_ulong
              x11.XQueryTree.argtypes=[C.c_void_p,C.c_ulong,C.POINTER(C.c_ulong),C.POINTER(C.c_ulong),C.POINTER(C.POINTER(C.c_ulong)),C.POINTER(C.c_uint)]
              x11.XQueryTree.restype=C.c_int
              x11.XGetGeometry.argtypes=[C.c_void_p,C.c_ulong,C.POINTER(C.c_ulong),C.POINTER(C.c_int),C.POINTER(C.c_int),C.POINTER(C.c_uint),C.POINTER(C.c_uint),C.POINTER(C.c_uint),C.POINTER(C.c_uint)]
              x11.XGetGeometry.restype=C.c_int
              x11.XMoveResizeWindow.argtypes=[C.c_void_p,C.c_ulong,C.c_int,C.c_int,C.c_uint,C.c_uint]
              x11.XFree.argtypes=[C.c_void_p]
              root=x11.XDefaultRootWindow(display); rr=C.c_ulong(); pr=C.c_ulong(); children=C.POINTER(C.c_ulong)(); n=C.c_uint()
              if not x11.XQueryTree(display,root,C.byref(rr),C.byref(pr),C.byref(children),C.byref(n)): return
              best=None
              try:
                  for i in range(n.value):
                      xid=children[i]; gr=C.c_ulong(); x=C.c_int(); y=C.c_int(); w=C.c_uint(); h=C.c_uint(); b=C.c_uint(); d=C.c_uint()
                      if x11.XGetGeometry(display,xid,C.byref(gr),C.byref(x),C.byref(y),C.byref(w),C.byref(h),C.byref(b),C.byref(d)):
                          area=int(w.value)*int(h.value)
                          if w.value>500 and h.value>400 and (best is None or area>best[0]): best=(area,int(xid))
                  if best:
                      x11.XMoveResizeWindow(display,best[1],0,0,WIDTH,HEIGHT); x11.XSync(display,False); time.sleep(.7)
              finally:
                  if children: x11.XFree(children)

          out=(OUT/"cifereca.stdout.log").open("w")
          err=(OUT/"cifereca.stderr.log").open("w")
          app=subprocess.Popen([
              "/usr/bin/python3","-m","cifereca",
              "--no-plugins",
              "--force-plugin","core.ui.pages",
              "--force-plugin","core.ui.widgets",
              "--force-plugin","core.ui.titlebar",
              "--force-plugin","core.ui.system",
              "--verbose"
          ],cwd=ROOT,env=os.environ.copy(),stdout=out,stderr=err,text=True)

          control=None
          shots=[]
          try:
              time.sleep(6)
              if app.poll() is not None: raise RuntimeError(f"app rc={app.returncode}")
              control=X11Input(); resize(control); time.sleep(1)

              shortcut(control,"Control_L","f"); time.sleep(1)
              shots.append(capture("01-recherche-vide.png"))

              control.type_text("secret")
              shots.append(capture("02-requete-saisie.png"))
              control.key("Return",True); control.key("Return",False); time.sleep(3)
              shots.append(capture("03-resultats-camille.png"))

              # Open Source filter in the filter row.
              control.click(386, 188); time.sleep(1)
              shots.append(capture("04-filtre-source.png"))
              control.key("Escape",True); control.key("Escape",False); time.sleep(.5)

              # Switch identity using the header dropdown. Keyboard selection keeps
              # this independent from row text rendering.
              control.click(337, 41); time.sleep(.5)
              control.key("Down",True); control.key("Down",False)
              control.key("Return",True); control.key("Return",False)
              time.sleep(3)
              shortcut(control,"Control_L","f"); time.sleep(.5)
              control.select_all_delete(); control.type_text("secret")
              control.key("Return",True); control.key("Return",False); time.sleep(3)
              shots.append(capture("05-resultats-alexandre.png"))

              (OUT/"report.json").write_text(json.dumps({"shots":shots},ensure_ascii=False,indent=2)+"\n")
          finally:
              if control:
                  try: shortcut(control,"Control_L","q")
                  except Exception: pass
                  control.close()
              try: app.wait(timeout=4)
              except subprocess.TimeoutExpired:
                  app.terminate()
                  try: app.wait(timeout=3)
                  except subprocess.TimeoutExpired: app.kill(); app.wait()
              out.close(); err.close()
          PY

          /usr/bin/python3 simulation/datasetctl.py exec ux-small -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none NO_AT_BRIDGE=1 \
            xvfb-run -a -s "-screen 0 1366x768x24" \
              /usr/bin/python3 /tmp/search_review.py

          cp /tmp/summary.json search-review-evidence/dataset-summary.json
          cp /tmp/catalog-scan.json search-review-evidence/catalog-scan.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-search-review-two-identities
          path: search-review-evidence/
          if-no-files-found: error
          retention-days: 2
