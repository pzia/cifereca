name: UX GTK4 CSS visual style study
on:
  push:
    branches: [ux/gtk-css-style-study-20261008]
    paths: [.github/workflows/ux-gtk-css-style-study.yml]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-style-dataset
      CIFERECA_HOST_XDG: /tmp/cifereca-style-host
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - name: Install real GTK runtime and simulator-backed plugins
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 libxtst6 xdotool openbox wmctrl python3-venv python3-gi python3-gi-cairo python3-cairo python3-pil gir1.2-gtk-4.0 gir1.2-adw-1 python3-httpx python3-packaging
          /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw
          print("Real GTK:", Gtk.get_major_version(), Gtk.get_minor_version())
          PY
          /usr/bin/python3 -m venv --system-site-packages /tmp/ux-venv
          /tmp/ux-venv/bin/python -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=11,<13" "PyMuPDF>=1.26,<2"
          mkdir -p /tmp/ux-style-zips "$CIFERECA_HOST_XDG"/{config,data,cache,state} /tmp/ux-style-bin gtk-style-evidence
          for plugin in transport-http provider-bnf-catalogue provider-gallica provider-gutenberg provider-kobo provider-numilog provider-paris home-page epub_optimizer recommendations; do
            /usr/bin/python3 scripts/package-plugin.py "src/plugins/$plugin" --out /tmp/ux-style-zips
          done
          export XDG_CONFIG_HOME="$CIFERECA_HOST_XDG/config" XDG_DATA_HOME="$CIFERECA_HOST_XDG/data" XDG_CACHE_HOME="$CIFERECA_HOST_XDG/cache" XDG_STATE_HOME="$CIFERECA_HOST_XDG/state"
          transport="$(find /tmp/ux-style-zips -name '*transport-http*.zip' -print -quit)"
          /tmp/ux-venv/bin/python -m cifereca.cli plugin install "$transport" --replace
          for archive in /tmp/ux-style-zips/*.zip; do
            case "$archive" in *transport-http*) continue ;; esac
            /tmp/ux-venv/bin/python -m cifereca.cli plugin install "$archive" --replace
          done
          cat >/tmp/ux-style-bin/cifereca <<'EOF'
          #!/usr/bin/env bash
          exec /tmp/ux-venv/bin/python -m cifereca "$@"
          EOF
          chmod +x /tmp/ux-style-bin/cifereca
          export PATH="/tmp/ux-style-bin:$PATH"
          export CIFERECA_DATASET_PLUGIN_SOURCE="$CIFERECA_HOST_XDG/data/cifereca/plugins/packages"
          /tmp/ux-venv/bin/python simulation/datasetctl.py rebuild ux-small
          /tmp/ux-venv/bin/python simulation/datasetctl.py summary ux-small --json >gtk-style-evidence/dataset.json
          /tmp/ux-venv/bin/python simulation/datasetctl.py env ux-small >/tmp/ux-style-env.sh
          source /tmp/ux-style-env.sh
          /tmp/ux-venv/bin/python -m cifereca.cli catalog-scan >gtk-style-evidence/library.json
      - name: Capture real GTK for six CSS styles and four screens
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/ux-style-bin:$PATH"
          export CIFERECA_DATASET_PLUGIN_SOURCE="$CIFERECA_HOST_XDG/data/cifereca/plugins/packages"
          source /tmp/ux-style-env.sh
          dbus-run-session -- xvfb-run -a -s "-screen 0 1366x900x24" bash <<'INNER'
          set -euo pipefail
          export GDK_BACKEND=x11 GSK_RENDERER=cairo GDK_SCALE=1 GTK_A11Y=none NO_AT_BRIDGE=1
          root="$GITHUB_WORKSPACE"
          openbox > "$root/gtk-style-evidence/openbox.log" 2>&1 &
          wmpid=$!
          mkdir -p "$XDG_CONFIG_HOME/gtk-4.0"
          savepng() {
            OUT="$1" /tmp/ux-venv/bin/python - <<'PY'
          import os
          from PIL import ImageGrab
          ImageGrab.grab(xdisplay=os.environ["DISPLAY"]).save(os.environ["OUT"])
          PY
          }
          tap() {
            xdotool mousemove --sync "$1" "$2"
            sleep 0.22
            xdotool click 1
          }
          for theme in 01-clair-v1 01-clair-v2 02-nocturne-v1 02-nocturne-v2 03-papier-v1 03-papier-v2; do
            echo "CAPTURE STYLE $theme"
            mkdir -p "$root/gtk-style-evidence/$theme"
            cp "$root/ux_style_lab/$theme.css" "$XDG_CONFIG_HOME/gtk-4.0/gtk.css"
            cp "$root/ux_style_lab/$theme.css" "$root/gtk-style-evidence/$theme/gtk.css"
            /tmp/ux-venv/bin/python "$root/simulation/datasetctl.py" cifereca ux-small --verbose -- --force-plugin transport.http --force-plugin core.ui.pages --force-plugin core.ui.widgets --force-plugin core.ui.titlebar --force-plugin core.ui.system --force-plugin ui.page.recommendations --force-plugin ui.page.epub-optimizer --force-plugin document.transformer.epub-optimizer --force-plugin document.transformer.pdf-eink-optimizer --force-plugin device.profile.xteink-x3 >"$root/gtk-style-evidence/$theme/app.out" 2>"$root/gtk-style-evidence/$theme/app.err" &
            apppid=$!
            win=""
            for _ in $(seq 1 100); do
              if ! kill -0 "$apppid" 2>/dev/null; then echo "APP EXITED" >&2; break; fi
              win="$(xdotool search --onlyvisible --name 'Cifereca' 2>/dev/null | head -1 || true)"
              [ -n "$win" ] && break
              sleep 0.23
            done
            if [ -z "$win" ]; then echo "NO WINDOW FOR $theme" >&2; kill -TERM "$apppid" 2>/dev/null || true; continue; fi
            wmctrl -ir "$win" -b add,maximized_vert,maximized_horz || true
            xdotool windowactivate --sync "$win" || true
            sleep 1.5
            savepng "$root/gtk-style-evidence/$theme/01-accueil.png"
            tap 90 205
            sleep 1.2
            tap 485 120
            xdotool key ctrl+a
            xdotool type --clearmodifiers --delay 55 "tour"
            xdotool key Return
            sleep 2
            tap 1240 120
            sleep 3
            tap 470 650
            sleep 1.0
            savepng "$root/gtk-style-evidence/$theme/02-recherche-detail.png"
            tap 90 248
            sleep 1.6
            tap 355 185
            sleep 1
            savepng "$root/gtk-style-evidence/$theme/03-bibliotheque.png"
            tap 90 470
            sleep 3
            savepng "$root/gtk-style-evidence/$theme/04-recommandations.png"
            tap 90 513
            sleep 1.5
            savepng "$root/gtk-style-evidence/$theme/05-optimiseur.png"
            tap 90 295
            sleep 1.0
            savepng "$root/gtk-style-evidence/$theme/06-recents.png"
            tap 90 338
            sleep 1.0
            savepng "$root/gtk-style-evidence/$theme/07-emprunts.png"
            tap 90 380
            sleep 1.0
            savepng "$root/gtk-style-evidence/$theme/08-historique.png"
            tap 90 425
            sleep 1.0
            savepng "$root/gtk-style-evidence/$theme/09-reservations.png"
            tap 112 558
            sleep 1.0
            savepng "$root/gtk-style-evidence/$theme/10-technique.png"
            actual_pid="$(xdotool getwindowpid "$win" 2>/dev/null || true)"
            xdotool windowclose "$win" 2>/dev/null || true
            if [ -n "$actual_pid" ]; then kill -TERM "$actual_pid" 2>/dev/null || true; fi
            kill -TERM "$apppid" 2>/dev/null || true
            wait "$apppid" 2>/dev/null || true
            sleep 1
            remaining="$(xdotool search --onlyvisible --name 'Cifereca' 2>/dev/null | head -1 || true)"
            if [ -n "$remaining" ]; then
              echo "STALE GTK WINDOW after $theme; terminating native app" >&2
              pid="$(xdotool getwindowpid "$remaining" 2>/dev/null || true)"
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
              sleep 0.5
            fi
          done
          kill -TERM "$wmpid" 2>/dev/null || true
          INNER
      - name: Cleanup isolated data
        if: always()
        shell: bash
        run: |
          /tmp/ux-venv/bin/python simulation/datasetctl.py down ux-small || true
      - name: Upload evidence including real GTK screenshots and CSS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cifereca-real-gtk-css-three-directions
          path: gtk-style-evidence/
          if-no-files-found: warn
          retention-days: 7
