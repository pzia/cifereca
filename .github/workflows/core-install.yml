name: Validate installed Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cifereca/**'
      - 'pyproject.toml'
      - 'VERSION'
      - 'README.md'
      - 'scripts/ci-smoke-installed-wheel.sh'
      - '.github/workflows/core-install.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    name: installed-core (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "setuptools>=69" wheel

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist

      - name: Smoke installed package outside source tree
        run: CIFERECA_EXPECTED_BUILD_SHA="$GITHUB_SHA" bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl
