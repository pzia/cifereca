name: Validate installed Core

# Matrix 3.11/3.12/3.13 is an explicit compatibility audit, not a second
# installed-Core validation on every main push. The ordinary checks remain
# in pr-ci.yml and core-full-install.yml; run this manually when needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    name: installed-core (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "setuptools>=69" wheel

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist

      - name: Smoke installed package outside source tree
        run: bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl
