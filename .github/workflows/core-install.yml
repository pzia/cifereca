name: Validate installed Core

on:
  push:
    paths:
      - "src/cifereca/**"
      - "pyproject.toml"
      - ".github/workflows/core-install.yml"
      - "scripts/ci-smoke-installed-wheel.sh"
  pull_request:
    paths:
      - "src/cifereca/**"
      - "pyproject.toml"
      - ".github/workflows/core-install.yml"
      - "scripts/ci-smoke-installed-wheel.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    name: installed-core (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "setuptools>=69" wheel

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist

      - name: Smoke installed package outside source tree
        run: bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl
