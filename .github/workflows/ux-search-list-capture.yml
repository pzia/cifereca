name: UX search-list capture

on:
  push:
    branches:
      - ux/record-simulator-video-20261008
    paths:
      - ".github/workflows/ux-search-list-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CIFERECA_DATASET_RUNTIME: /tmp/cifereca-search-list
      CIFERECA_GTK_TEST_HARNESS: ${{ github.workspace }}/environnements/openai-chat-debian
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-list-recipe

      - name: Install GTK/X11 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxtst6 \
            python3-gi python3-gi-cairo python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-httpx python3-packaging

      - name: Prepare focused dataset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cifereca-bin search-list-evidence
          cat > /tmp/cifereca-bin/cifereca <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/python3 -m cifereca "$@"
          EOF
          chmod +x /tmp/cifereca-bin/cifereca
          export PATH="/tmp/cifereca-bin:$PATH"

          /usr/bin/python3 simulation/datasetctl.py rebuild ux-search-list
          /usr/bin/python3 simulation/recipes/search_list_fixture.py
          /usr/bin/python3 simulation/datasetctl.py summary ux-search-list --json \
            > search-list-evidence/dataset-summary.json

          /usr/bin/python3 simulation/datasetctl.py exec ux-search-list -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /usr/bin/python3 -m cifereca.cli catalog-scan \
            > search-list-evidence/catalog-scan.json

          cp "$CIFERECA_DATASET_RUNTIME/ux-search-list/search-list-fixture.json" \
            search-list-evidence/search-list-fixture.json

      - name: Capture Search list at three widths
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/tmp/cifereca-bin:$PATH"

          for width in 760 1024 1300; do
            out="$GITHUB_WORKSPACE/search-list-evidence/$width"
            mkdir -p "$out"
            /usr/bin/python3 simulation/datasetctl.py exec ux-search-list -- \
              env \
                PYTHONPATH="$GITHUB_WORKSPACE/src" \
                CIFERECA_GTK_TEST_HARNESS="$CIFERECA_GTK_TEST_HARNESS" \
                GDK_BACKEND=x11 \
                GSK_RENDERER=cairo \
                GTK_A11Y=none \
                NO_AT_BRIDGE=1 \
              xvfb-run -a -s "-screen 0 ${width}x720x24" \
                /usr/bin/python3 simulation/recipes/search_list_capture.py \
                  --window-width "$width" \
                  --window-height 720 \
                  --startup-wait 5 \
                  --search-wait 4 \
                  --out-dir "$out" \
                  --cwd "$GITHUB_WORKSPACE" -- \
                /usr/bin/python3 simulation/datasetctl.py cifereca ux-search-list --verbose
          done

      - name: Collect simulator logs
        if: always()
        shell: bash
        run: |
          mkdir -p search-list-evidence/simulator-logs
          cp -a "$CIFERECA_DATASET_RUNTIME/ux-search-list/logs/." \
            search-list-evidence/simulator-logs/ 2>/dev/null || true
          /usr/bin/python3 simulation/datasetctl.py down ux-search-list || true

      - name: Upload focused UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-search-list-evidence
          path: search-list-evidence/
          if-no-files-found: error
          retention-days: 2
