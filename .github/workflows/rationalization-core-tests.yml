name: Rationalization targeted Kobo backup fault isolation

on:
  push:
    branches:
      - rationalization/kobo-backup-fault-isolation
    paths:
      - "tests/test_kobo_backup_fault_isolation.py"
      - ".github/workflows/rationalization-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Run Kobo backup fault isolation regressions
        run: python -m pytest -q tests/test_kobo_backup_fault_isolation.py
