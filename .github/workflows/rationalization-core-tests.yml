name: Rationalization targeted sync-state test

on:
  push:
    branches:
      - rationalization/core-tests-sync-state
    paths:
      - "tests/test_sync_state_contract.py"
      - ".github/workflows/rationalization-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Run sync state regressions
        run: python -m pytest -q tests/test_sync_state_contract.py
