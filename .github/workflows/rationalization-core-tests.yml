name: Rationalization targeted ADEPT inventory binding

on:
  push:
    branches:
      - rationalization/adept-inventory-binding
    paths:
      - "tests/test_adept_inventory_binding.py"
      - ".github/workflows/rationalization-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Run ADEPT inventory binding regressions
        run: python -m pytest -q tests/test_adept_inventory_binding.py
