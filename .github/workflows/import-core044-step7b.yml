name: Import Core044 GUI step 7B

on:
  push:
    branches:
      - migration/core044-gui-step7b
    paths:
      - '.migration-step7b/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore GUI source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .migration-step7b -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 8
          cat .migration-step7b/payload.b64.part.* | base64 -d > /tmp/step7b-gui.tar.xz
          echo "3fde9a9b8c7af58eb6d46c4cb103f968edfbd90d5bd33489142e49175c141a7c  /tmp/step7b-gui.tar.xz" | sha256sum -c -
          tar -xJf /tmp/step7b-gui.tar.xz -C .
          python -m compileall -q src/cifereca/gui
          PYTHONPATH=src python - <<'PY'
          import cifereca.gui.query_model
          import cifereca.gui.shell_model
          import cifereca.gui.search_intent
          import cifereca.gui.facet_text
          print("step7b-pure-gui-imports-ok")
          PY
          rm -rf .migration-step7b
          rm -f .github/workflows/import-core044-step7b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Core044 GUI source step 7B'
          git push origin HEAD:migration/core044-gui-step7b
