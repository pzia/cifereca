name: Restore Core tests step 1A7

on:
  push:
    branches:
      - rationalization/core-tests-step1a7
    paths:
      - '.restore-tests-step1a7/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .restore-tests-step1a7/payload.b64 > /tmp/core-tests-step1a7.tar.xz
          echo "db0ba5dc98b98632b552fe0e9ec913072a15be639f8fcd526f283825742e3682  /tmp/core-tests-step1a7.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a7.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_login_retry.py             tests/test_normalize.py             tests/test_updater.py

          rm -rf .restore-tests-step1a7
          rm -f .github/workflows/restore-core-tests-step1a7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A7'
          git push origin HEAD:rationalization/core-tests-step1a7
