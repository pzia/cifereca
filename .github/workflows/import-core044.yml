name: Import Core044 sources

on:
  push:
    paths:
      - '.source-upload4/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct Core044 source tree
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .source-upload4 -maxdepth 1 -type f -name 'source.part.*' | wc -l)
          test "$count" -eq 22
          tmp=$(mktemp -d)
          cat .source-upload4/source.part.* | base64 -d > "$tmp/source.tar.xz"
          echo "a80b6a420728be8f6e50cd0ccb7aa130c53e16ef2e2ac8e609792478e106134d  $tmp/source.tar.xz" | sha256sum -c -
          mkdir "$tmp/source"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp/source"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name plugins -exec rm -rf {} +
          cp -a "$tmp/source"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Cifereca Core 0.9.44-dev.1 sources'
          git push origin HEAD:main
