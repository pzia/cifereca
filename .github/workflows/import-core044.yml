name: Import Core044 sources

on:
  push:
    paths:
      - '.source-upload3/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct clean Core044 source tree
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .source-upload3 -maxdepth 1 -type f -name 'source.part.*' | wc -l)
          test "$count" -eq 34
          tmp=$(mktemp -d)
          cat .source-upload3/source.part.* | base64 -d > "$tmp/source.tar.xz"
          mkdir "$tmp/source"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp/source"
          git checkout --orphan core044-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$tmp/source"/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish Cifereca Core 0.9.44-dev.1 sources'
          git push --force origin HEAD:main
