name: Import Core044 sources

on:
  push:
    paths:
      - '.source-upload5/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct Core044 source tree
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .source-upload5 -maxdepth 1 -type f -name 'source.part.*' | wc -l)
          test "$count" -eq 12
          tmp=$(mktemp -d)
          cat .source-upload5/source.part.* | base64 -d > "$tmp/source.tar.xz"
          echo "718ddf1d845b2a0094c6ae4bbb46158959eef0e733df5041c9345565615e5935  $tmp/source.tar.xz" | sha256sum -c -
          mkdir "$tmp/source"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp/source"

          # Preserve the separately published plugin source tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name plugins -exec rm -rf {} +
          cp -a "$tmp/source"/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Cifereca Core 0.9.44-dev.1 sources'
          git push origin HEAD:main
