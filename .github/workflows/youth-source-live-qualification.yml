name: Qualify youth public HTTPS (manual)

# Public publisher websites are contacted only after a human explicitly opts in.
# No push, pull_request, schedule or release trigger.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Public source (one attempt; stop on 403/429/timeout)'
        required: true
        type: choice
        options:
          - milan
          - ecole-loisirs
      confirm_live:
        description: 'I authorize a bounded live HTTPS request to the public publisher site'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: youth-live-qualification
  cancel-in-progress: false

jobs:
  qualification:
    name: One public HTTPS qualification
    if: ${{ inputs.confirm_live == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the checked-out Core
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run bounded real-source qualification
        env:
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE" in
            milan|ecole-loisirs) ;;
            *) echo 'Invalid public source' >&2; exit 2 ;;
          esac
          # The publisher's first search page contains age 3–6 evidence.
          # The 3-years case still executes one GET and filters cache locally.
          AGE=8
          if [[ "$SOURCE" == "ecole-loisirs" ]]; then AGE=3; fi
          mkdir -p youth-live-evidence
          # Keep untrusted stdout/stderr outside uploaded artifacts and summaries.
          raw="$RUNNER_TEMP/youth-live-unvalidated.json"
          trap 'rm -f "$raw"' EXIT
          python scripts/qualify-youth-source-live.py \
            --source "$SOURCE" --age "$AGE" --limit 2 --timeout 6 \
            --confirm-live > "$raw" 2>/dev/null || :
          # Fail closed, even if a plugin wrote extra text to stdout.
          python - "$raw" <<'PY' > youth-live-evidence/result.json
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location(
              "youth_live_evidence", "scripts/qualify-youth-source-live.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              raw_report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              if not isinstance(raw_report, dict) or raw_report.get("source") != os.environ["SOURCE"]:
                  raise ValueError("invalid report source")
              safe = module.public_report(raw_report)
              if safe["result"] == "PASS" and (
                  safe.get("requests_count", 0) < 1
                  or safe.get("qualified_notice_count", 0) < 1
              ):
                  raise ValueError("unverified PASS")
          except Exception:
              safe = {"result": "BLOCKED", "error_code": "invalid_evidence"}
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          sys.exit(0 if safe["result"] == "PASS" else 1)
          PY
      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          if [[ -s youth-live-evidence/result.json ]]; then
            {
              echo '## Youth source live qualification'
              echo
              echo 'This is a manually consented public HTTPS test, not an E2E GTK fixture.'
              echo
              echo '~~~json'
              cat youth-live-evidence/result.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No JSON evidence produced (check workflow/setup logs).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youth-source-live-evidence
          path: youth-live-evidence/result.json
          if-no-files-found: warn
          retention-days: 7
