name: "TEMP provider Core LOC audit 2026-11-11"
on:
  pull_request:
    paths:
      - ".github/workflows/temp-provider-loc-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 scripts/ci_provider_core_coupling_report.py --json > /tmp/provider-loc.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/provider-loc.json'))
          print('LOC_AUDIT_RESULT_BEGIN')
          print(json.dumps({
            'head': __import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'files':d['total_core_python_files'],
            'named':d['expanded_named_modules'],
            'generic':d['remaining_generic_after_expanded_named_scope'],
            'historical':d['historical'],
            'partition':d['line_partition'],
            'top_generic_by_ast_signal':d['top_generic_by_ast_signal'][:15],
            'vendor_named_modules':d['vendor_named_modules_outside_legacy_dedicated_scope']
          },ensure_ascii=False,sort_keys=True))
          print('LOC_AUDIT_RESULT_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-loc-full-report
          path: /tmp/provider-loc.json
