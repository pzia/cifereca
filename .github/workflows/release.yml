name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/release-trigger"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag à publier (doit être v<VERSION>)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not integrated into main." >&2
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          if version != project_version:
              raise SystemExit(f"VERSION ({version}) != pyproject.toml ({project_version})")
          PY
          version="$(cat VERSION)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            tag="$(tr -d '[:space:]' < .github/release-trigger)"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="v$version"
          fi
          expected="v$version"
          if [[ "$tag" != "$expected" ]]; then
            echo "Tag $tag does not match VERSION ($expected)" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *"+"* || "$version" =~ (a|b|rc)[0-9] ]]; then
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Refuse published Core release and mismatched source tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          python scripts/ci_core_release_preflight.py \
            --tag "$RELEASE_TAG" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Install validation and build dependencies
        run: python -m pip install --disable-pip-version-check "setuptools>=69" wheel "pytest>=8,<9" "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12" "PyMuPDF>=1.26,<2"

      - name: Validate release snapshot and plugin versions
        run: python scripts/check_release_inventory.py

      - name: Run Core tests
        run: python -m pytest -q tests

      - name: Run plugin tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: bash scripts/ci-run-plugin-tests.sh

      - name: Validate packaging
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release

      - name: Build Core wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist

      - name: Smoke installed Core wheel
        env:
          CIFERECA_SMOKE_VENV: /tmp/cifereca-release-installed
        run: bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl

      - name: Build plugin bundle
        run: python scripts/package-all-in-one.py

      - name: Build and validate development snapshot
        run: |
          python scripts/package-dev-snapshot.py \
            --validate-with-update-dev \
            --update-dev /tmp/cifereca-release-installed/bin/cifereca-update-dev

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Recheck immutable Core release target before draft mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python scripts/ci_core_release_preflight.py \
            --tag "$RELEASE_TAG" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          create_args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes --draft)
          edit_args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
            edit_args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" "${create_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify downloaded Core release draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/core-release-draft-check"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$downloaded"
          mapfile -t built < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t uploaded < <(find "$downloaded" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${built[*]}" != "${uploaded[*]}" ]]; then
            echo 'Core draft asset set does not match build output.' >&2
            exit 1
          fi
          for file in "${built[@]}"; do
            cmp "dist/$file" "$downloaded/$file"
          done
          (cd "$downloaded" && sha256sum -c SHA256SUMS)
          python scripts/ci_core_release_preflight.py \
            --tag "$RELEASE_TAG" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
