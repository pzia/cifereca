name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/release-trigger"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag à publier (doit être v<VERSION>)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not integrated into main." >&2
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          if version != project_version:
              raise SystemExit(f"VERSION ({version}) != pyproject.toml ({project_version})")
          PY
          version="$(cat VERSION)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            tag="$(tr -d '[:space:]' < .github/release-trigger)"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="v$version"
          fi
          expected="v$version"
          if [[ "$tag" != "$expected" ]]; then
            echo "Tag $tag does not match VERSION ($expected)" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *"+"* || "$version" =~ (a|b|rc)[0-9] ]]; then
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Refuse published Core release and mismatched source tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          python scripts/ci_core_release_preflight.py \
            --tag "$RELEASE_TAG" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Install validation and build dependencies
        run: python -m pip install --disable-pip-version-check "setuptools>=69" wheel "pytest>=8,<9" "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12" "PyMuPDF>=1.26,<2"

      - name: Validate release snapshot and plugin versions
        run: python scripts/check_release_inventory.py

      - name: Run Core tests
        # These tests spawn isolated Python processes. Match PR CI's import
        # scope so subprocesses find the source tree and Kobo provider without
        # installing a different candidate than the one being released.
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/plugins/provider-kobo
        run: python -m pytest -q tests

      - name: Run plugin tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: bash scripts/ci-run-plugin-tests.sh

      - name: Validate packaging
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release

      - name: Stamp verified Core source Git revision
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "src")
          from cifereca.startup_revision import stamp_source_git_commit
          actual = subprocess.check_output(
              ["git", "rev-parse", "--verify", "HEAD"], text=True, timeout=10,
          ).strip().lower()
          if actual != os.environ["RELEASE_COMMIT"].lower():
              raise SystemExit("release_checkout_commit_mismatch")
          stamp_source_git_commit(Path.cwd(), actual)
          PY

      - name: Build Core wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist

      - name: Verify Core wheel embeds the exact release SHA
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("cifereca-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("release_core_wheel_count_invalid")
          with ZipFile(wheels[0]) as wheel:
              revision = wheel.read("cifereca/_build_revision.txt").decode("ascii")
          if revision != os.environ["RELEASE_COMMIT"].lower() + "\n":
              raise SystemExit("release_core_wheel_revision_mismatch")
          PY

      - name: Smoke installed Core wheel
        env:
          CIFERECA_SMOKE_VENV: /tmp/cifereca-release-installed
        run: bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl

      - name: Build plugin bundle
        run: python scripts/package-all-in-one.py

      - name: Build and validate development snapshot
        run: |
          python scripts/package-dev-snapshot.py \
            --validate-with-update-dev \
            --update-dev /tmp/cifereca-release-installed/bin/cifereca-update-dev

      - name: Validate exact Core release assets and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          sha="$(git rev-parse --short=12 HEAD)"
          wheel="cifereca-$version-py3-none-any.whl"
          dev="cifereca-dev-plugins-$sha.zip"
          bundle="cifereca-plugins-all-in-one-$sha.zip"
          # Refuse publishing any unreviewed archive, diagnostic dump, log
          # or profile accidentally deposited into dist by a future step.
          mapfile -t expected < <(printf '%s\n' "$wheel" "$dev" "$bundle" | LC_ALL=C sort)
          mapfile -t actual < <(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            echo 'Unexpected Core release artifact set; refusing publication.' >&2
            exit 1
          fi
          for file in "${expected[@]}"; do
            test -f "dist/$file" && test ! -L "dist/$file" && test -s "dist/$file"
          done
          (
            cd dist
            sha256sum "$wheel" "$dev" "$bundle" > SHA256SUMS
          )
          {
            echo "RELEASE_WHEEL=$wheel"
            echo "RELEASE_DEV=$dev"
            echo "RELEASE_BUNDLE=$bundle"
          } >> "$GITHUB_ENV"

      - name: Install Cosign for Core release provenance
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.6"

      - name: Sign and verify Core wheel and bundles
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for artifact in "dist/$RELEASE_WHEEL" "dist/$RELEASE_DEV" "dist/$RELEASE_BUNDLE"; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            test -s "$artifact.sigstore.json"
            cosign verify-blob "$artifact" \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA"
          done
      - name: Recheck immutable Core release target before draft mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python scripts/ci_core_release_preflight.py \
            --tag "$RELEASE_TAG" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          # GitHub's auto-generated notes can exceed the release API's
          # 125000-character body limit for long-lived development branches.
          # Publish deterministic, bounded provenance instead of untrusted
          # unbounded commit/PR content. Full history remains linked.
          notes_file="$RUNNER_TEMP/core-release-notes.md"
          {
            printf '# Cifereca %s\n\n' "$RELEASE_TAG"
            printf 'Distribution Core et plugins de release, construite sur le commit vérifié [%s](https://github.com/%s/commit/%s).\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '%s\n' '- Artefacts : wheel Core, ZIP de développement, ZIP all-in-one, SHA256SUMS et trois bundles de signature Sigstore.'
            printf '%s\n\n' '- Tous les octets et signatures sont vérifiés avant publication ; consulter SHA256SUMS pour les téléchargements.'
            printf 'Inventaire de versions : [plugin-release.json](https://github.com/%s/blob/%s/src/cifereca/plugin-release.json).\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$notes_file"
          test "$(wc -c < "$notes_file")" -le 8192
          create_args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes_file" --draft)
          edit_args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes_file" --draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
            edit_args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" "${create_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$RELEASE_WHEEL" "dist/$RELEASE_DEV" \
            "dist/$RELEASE_BUNDLE" "dist/SHA256SUMS" \
            "dist/$RELEASE_WHEEL.sigstore.json" \
            "dist/$RELEASE_DEV.sigstore.json" \
            "dist/$RELEASE_BUNDLE.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify downloaded Core release draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/core-release-draft-check"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$downloaded"
          mapfile -t built < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t uploaded < <(find "$downloaded" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${built[*]}" != "${uploaded[*]}" ]]; then
            echo 'Core draft asset set does not match build output.' >&2
            exit 1
          fi
          for file in "${built[@]}"; do
            cmp "dist/$file" "$downloaded/$file"
          done
          (cd "$downloaded" && sha256sum -c SHA256SUMS)
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for archive in "$RELEASE_WHEEL" "$RELEASE_DEV" "$RELEASE_BUNDLE"; do
            test -s "$downloaded/$archive.sigstore.json"
            cosign verify-blob "$downloaded/$archive" \
              --bundle "$downloaded/$archive.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA"
          done
          python scripts/ci_core_release_preflight.py \
            --tag "$RELEASE_TAG" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
