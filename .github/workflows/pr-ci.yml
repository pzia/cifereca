name: PR CI

on:
  pull_request:
    paths:
      - "src/cifereca/**"
      - "src/plugins/**"
      - "tests/**"
      - "simulation/**"
      - "e2e/**"
      - "environnements/chatgpt-work/**"
      - "environnements/openai-chat-debian/capture_app.py"
      - "pyproject.toml"
      - "VERSION"
      - "scripts/ci-run-plugin-tests.sh"
      - "scripts/ci-smoke-installed-wheel.sh"
      - "scripts/plugin_packaging.py"
      - "scripts/test_plugin_packaging.py"
      - "scripts/verify-packaging.py"
      - "scripts/package-all-in-one.py"
      - "scripts/package-dev-snapshot.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    name: PR CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select validation scopes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            {
              echo "core=true"
              echo "core_ui=true"
              echo "plugins=true"
              echo "plugin_targets="
              echo "packaging=true"
              echo "install=true"
              echo "gui=true"
              echo "dataset=true"
              echo "python=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_file="$RUNNER_TEMP/cifereca-changed-files"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee "$changed_file"

          matches() {
            grep -Eq "$1" "$changed_file"
          }

          core=false
          core_ui=false
          plugins=false
          plugin_targets=""
          plugin_scope_all=false
          packaging=false
          install=false
          gui=false
          dataset=false

          ui_test_re='^tests/(test_core_ui_.*|test_core_09.*|test_gui_compat|test_query_controls_batching|test_ui_iteration_097|test_shell_controls_097_dev5|test_adept_ui_contract|test_identity_save_ui_contract|test_core_book_detail_projection|test_cover_loader|test_regressions_099|test_095_consolidation|test_core042_library_ui|test_core_415_titlebar_action_registry|test_core_458_unknown_medium|test_core_464_document_links|test_core_470_provider_search_capabilities|test_builtin_ui_rationalization|test_e2e_instrumentation|test_e2e_runner_contract)\.py

          if matches '^src/plugins/'; then
            plugins=true
          fi
          if matches '^(scripts/ci-run-plugin-tests\.sh$|pyproject\.toml$)'; then
            plugins=true
            plugin_scope_all=true
          fi
          if grep -E '^src/cifereca/' "$changed_file" | grep -Ev '^src/cifereca/(gui/|builtin_ui/|app\.py$)' >/dev/null 2>&1; then
            plugins=true
            plugin_scope_all=true
          fi

          if matches '^(src/plugins/|scripts/(plugin_packaging\.py|test_plugin_packaging\.py|verify-packaging\.py|package-all-in-one\.py|package-dev-snapshot\.py)$)'; then
            packaging=true
            plugins=true
          fi

          if matches '^(pyproject\.toml$|VERSION$|scripts/ci-smoke-installed-wheel\.sh$|src/cifereca/(__init__\.py|__main__\.py|cli\.py|updater\.py|dev_updater\.py|plugin_test_runner\.py)$|src/cifereca/builtin_ui/)'; then
            install=true
          fi

          if matches '^(e2e/|src/cifereca/(app\.py|gui/|builtin_ui/)|environnements/openai-chat-debian/capture_app\.py$)'; then
            gui=true
            core_ui=true
          fi

          if matches '^simulation/'; then
            dataset=true
          fi

          # Changes to CI policy validate every gate once. Selective scopes are
          # only trusted after the workflow definition itself has gone green.
          if matches '^\.github/workflows/'; then
            core=true
            core_ui=true
            plugins=true
            plugin_scope_all=true
            packaging=true
            install=true
            gui=true
            dataset=true
          fi

          if [[ "$plugins" == true && "$plugin_scope_all" != true ]]; then
            plugin_targets="$(
              awk -F/ '/^src\/plugins\/[^/]+\// {print $1 "/" $2 "/" $3}' "$changed_file" |
                sort -u |
                paste -sd' ' -
            )"
          fi

          python=false
          if [[ "$core" == true || "$core_ui" == true || "$plugins" == true || "$packaging" == true || "$install" == true || "$dataset" == true ]]; then
            python=true
          fi

          {
            echo "core=$core"
            echo "core_ui=$core_ui"
            echo "plugins=$plugins"
            echo "plugin_targets=$plugin_targets"
            echo "packaging=$packaging"
            echo "install=$install"
            echo "gui=$gui"
            echo "dataset=$dataset"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Core test dependencies
        if: steps.scope.outputs.core == 'true' || steps.scope.outputs.core_ui == 'true'
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12"
          if [[ "${{ steps.scope.outputs.plugins }}" == "true" ]]; then
            python -m pip install --disable-pip-version-check "PyMuPDF>=1.26,<2"
          fi

      - name: Install plugin-only test dependencies
        if: steps.scope.outputs.plugins == 'true' && steps.scope.outputs.core != 'true' && steps.scope.outputs.core_ui != 'true'
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12" "PyMuPDF>=1.26,<2"

      - name: Run Core tests
        if: steps.scope.outputs.core == 'true'
        run: python -m pytest -q tests

      - name: Run CoreUI tests
        if: steps.scope.outputs.core_ui == 'true' && steps.scope.outputs.core != 'true'
        run: |
          python -m pytest -q \
            tests/test_core_ui_*.py \
            tests/test_core_09*.py \
            tests/test_gui_compat.py \
            tests/test_query_controls_batching.py \
            tests/test_ui_iteration_097.py \
            tests/test_shell_controls_097_dev5.py \
            tests/test_adept_ui_contract.py \
            tests/test_identity_save_ui_contract.py \
            tests/test_core_book_detail_projection.py \
            tests/test_cover_loader.py \
            tests/test_regressions_099.py \
            tests/test_095_consolidation.py \
            tests/test_core042_library_ui.py \
            tests/test_core_415_titlebar_action_registry.py \
            tests/test_core_458_unknown_medium.py \
            tests/test_core_464_document_links.py \
            tests/test_core_470_provider_search_capabilities.py \
            tests/test_builtin_ui_rationalization.py \
            tests/test_e2e_instrumentation.py \
            tests/test_e2e_runner_contract.py
      - name: Run plugin tests
        if: steps.scope.outputs.plugins == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PLUGIN_TARGETS: ${{ steps.scope.outputs.plugin_targets }}
        run: |
          if [[ -n "$PLUGIN_TARGETS" ]]; then
            read -r -a targets <<< "$PLUGIN_TARGETS"
            bash scripts/ci-run-plugin-tests.sh "${targets[@]}"
          else
            bash scripts/ci-run-plugin-tests.sh
          fi

      - name: Validate plugin packaging
        if: steps.scope.outputs.packaging == 'true'
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging

      - name: Smoke installed Core wheel
        if: steps.scope.outputs.install == 'true'
        run: |
          python -m pip install --disable-pip-version-check "setuptools>=69" wheel
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl

      - name: Validate simulation dataset harness
        if: steps.scope.outputs.dataset == 'true'
        env:
          CIFERECA_DATASET_RUNTIME: /tmp/cifereca-datasets
        run: |
          python -m compileall -q simulation
          python -m unittest discover -s simulation/tests -v
          python simulation/datasetctl.py up ux-small
          trap 'python simulation/datasetctl.py down ux-small' EXIT
          python simulation/datasetctl.py status ux-small
          python simulation/datasetctl.py config ux-small

      - name: Install GTK E2E runtime
        if: steps.scope.outputs.gui == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 libxtst6 \
            python3-gi python3-gi-cairo python3-cairo python3-pil \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-httpx python3-packaging

      - name: Run reference E2E
        if: steps.scope.outputs.gui == 'true'
        env:
          CIFERECA_E2E_PYTHON: /usr/bin/python3
        run: dbus-run-session -- /usr/bin/python3 e2e/run.py --plugin core

      - name: Publish E2E summary
        if: always() && steps.scope.outputs.gui == 'true'
        shell: bash
        run: |
          {
            echo "## E2E GTK"
            echo
            if [ -f e2e-artifacts/summary.json ]; then
              echo '~~~json'
              cat e2e-artifacts/summary.json
              echo '~~~'
            else
              echo "Aucun résumé produit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E debug artifacts on failure
        if: failure() && steps.scope.outputs.gui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-debug
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 3


          if matches '^(src/cifereca/(gui/|builtin_ui/|app\.py$))' || matches "$ui_test_re"; then
            core_ui=true
          fi

          if grep -E '^src/cifereca/' "$changed_file" | grep -Ev '^src/cifereca/(gui/|builtin_ui/|app\.py$)' >/dev/null 2>&1; then
            core=true
          fi
          if grep -E '^tests/' "$changed_file" | grep -Ev "$ui_test_re" >/dev/null 2>&1; then
            core=true
          fi
          if matches '^pyproject\.toml

          if matches '^src/plugins/'; then
            plugins=true
          fi
          if matches '^(scripts/ci-run-plugin-tests\.sh$|pyproject\.toml$)'; then
            plugins=true
            plugin_scope_all=true
          fi
          if grep -E '^src/cifereca/' "$changed_file" | grep -Ev '^src/cifereca/(gui/|builtin_ui/|app\.py$)' >/dev/null 2>&1; then
