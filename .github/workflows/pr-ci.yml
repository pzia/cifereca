name: PR CI

# Stable required PR CI context even for docs-only or governance-only PRs.
# Expensive validation remains change-scoped inside Select validation scopes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: PR CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select validation scopes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            {
              echo "core=true"
              echo "core_mode=full"
              echo "core_targets=tests"
              echo "plugins=true"
              echo "plugin_targets="
              echo "packaging=true"
              echo "install=true"
              echo "dataset=true"
              echo "python=true"
              echo "httpx_boundary=true"
              echo "bnf_reader=$(python3 scripts/ci_bnf_reader_gate.py select --full)"
              echo "lending_conformance=$(python3 scripts/ci_lending_conformance_gate.py select --full)"
              echo "branch_cleanup=$(test -f scripts/nettoyer_branches_git_stream.py && echo true || echo false)"
              echo "recette=$(test -f scripts/recette.py && echo true || echo false)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_file="$RUNNER_TEMP/cifereca-changed-files"
          # A stale PR branch must not acquire unrelated changes from main
          # as test-scope changes. First reject a tree already in main, then
          # select ONLY the files changed since the PR branch point.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA"; then
            echo "PR tree is identical to current main: refuse redundant no-op merge" >&2
            exit 1
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | tee "$changed_file"

          matches() {
            grep -Eq "$1" "$changed_file"
          }

          core=false
          core_mode=none
          core_targets=""
          plugins=false
          plugin_targets=""
          plugin_scope_all=false
          packaging=false
          install=false
          dataset=false
          branch_cleanup=false
          recette=false
          bnf_reader=$(python3 scripts/ci_bnf_reader_gate.py select "$changed_file")
          lending_conformance=$(python3 scripts/ci_lending_conformance_gate.py select "$changed_file")

          if matches '^(src/cifereca/|tests/|e2e/|environnements/openai-chat-debian/capture_app\.py$|pyproject\.toml$|scripts/ci-select-core-tests\.py$|scripts/ci_test_dependency_guard\.py$|scripts/ci_select_plugin_tests\.py$|scripts/check_release_inventory\.py$|scripts/ci_core_release_preflight\.py$)'; then
            core=true
          fi

          if matches '^src/plugins/'; then
            plugins=true
          fi
          if matches '^(scripts/ci-run-plugin-tests\.sh$|scripts/ci_select_plugin_tests\.py$|\.github/plugin-test-dependencies\.json$|pyproject\.toml$)'; then
            plugins=true
            plugin_scope_all=true
          fi
          if grep -E '^src/cifereca/' "$changed_file" | grep -Ev '^src/cifereca/(gui/|builtin_ui/|app\.py$)' >/dev/null 2>&1; then
            plugins=true
            plugin_scope_all=true
          fi

          if matches '^(src/plugins/|scripts/(plugin_packaging\.py|test_plugin_packaging\.py|verify-packaging\.py|package-all-in-one\.py|package-dev-snapshot\.py|package_partial_plugins\.py|test_partial_plugin_release\.py|ci_plugins_release_target\.py)$)'; then
            packaging=true
            plugins=true
          fi

          if matches '^(README\.md$|pyproject\.toml$|VERSION$|scripts/ci-smoke-installed-wheel\.sh$|src/cifereca/(__init__\.py|__main__\.py|cli\.py|updater\.py|dev_updater\.py|plugin_test_runner\.py)$|src/cifereca/builtin_ui/)'; then
            install=true
          fi

          if matches '^simulation/'; then
            dataset=true
          fi

          # Remote branch deletion requires offline safety tests whenever its
          # script or tests change; they live outside the usual tests/ tree.
          if matches '^scripts/(nettoyer_branches_git_stream\.py|test_nettoyer_branches_git_stream\.py)$'; then
            branch_cleanup=true
          fi

          # #3607: mandatory OS confinement and lifecycle proof, synthetic only.
          # Also exercise this route when changing the workflow itself.
          if matches '^(scripts/recette(-doctor)?\.py$|tests/test_recette(_doctor)?\.py$|\.github/workflows/pr-ci\.yml$)' && \
             [[ -f scripts/recette.py && -f tests/test_recette.py ]]; then
            recette=true
          fi

          # Gate script changes exercise packaging and installed-Core validation.
          if matches '^scripts/(ci-plugins-only-runtime-gate\.sh|ci-plugins-only-historical-core-gate\.sh|ci-full-release-install-gate\.py)$'; then
            packaging=true
            install=true
          fi

          if [[ "$plugins" == true ]]; then
            python3 scripts/ci_select_plugin_tests.py \
              --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" \
              --targets-file "$RUNNER_TEMP/cifereca-plugin-targets"
            plugin_targets="$(cat "$RUNNER_TEMP/cifereca-plugin-targets")"
          fi

          if [[ "$core" == true ]]; then
            IFS=$'\t' read -r core_mode core_targets e2e_scenario < <(
              python3 scripts/ci-select-core-tests.py "$changed_file"
            )
            # Deleted or renamed tests can invalidate other suites even when
            # another changed test remains. Never skip their consumers.
            if git diff --name-status "$BASE_SHA...$HEAD_SHA" -- tests/ | \
               grep -Eq '^(D|R[0-9]*|C[0-9]*|T|U)[[:space:]]'; then
              core_mode=full
              core_targets=tests
            fi
          fi

          if matches '^\.github/workflows/'; then
            # Scope only an isolated, recognized workflow edit. Any mixed or
            # unknown diff keeps the existing exhaustive CI contract.
            workflow_changed=""
            if [[ "$(wc -l < "$changed_file")" -eq 1 ]]; then
              workflow_changed="$(head -n 1 "$changed_file")"
            fi
            case "$workflow_changed" in
              .github/workflows/core-tests.yml)
                core=true
                core_mode=ci-contract
                core_targets="tests/test_ci_core_main_selection.py tests/test_ci_core_test_selection.py tests/test_ci_main_path_filters.py tests/test_ci_required_check_contract.py tests/test_ci_pr_workflow_scopes.py"
                ;;
              .github/workflows/plugin-tests.yml)
                core=true
                core_mode=ci-contract
                core_targets="tests/test_ci_main_path_filters.py tests/test_ci_plugin_selection.py tests/test_ci_pr_workflow_scopes.py"
                plugins=true
                plugin_scope_all=true
                ;;
              .github/workflows/e2e-smoke.yml)
                # E2E Smoke runs the full real GTK gate on its own PR trigger.
                core=true
                core_mode=ci-contract
                core_targets="tests/test_ci_2027_e2e_replay_completeness.py tests/test_ci_select_e2e.py tests/test_e2e_ci_paths.py tests/test_ci_gtk_smoke_privacy.py tests/test_ci_required_check_contract.py tests/test_ci_pr_workflow_scopes.py"
                ;;
              .github/workflows/core-install.yml)
                core=true
                core_mode=ci-contract
                core_targets="tests/test_ci_main_path_filters.py tests/test_ci_required_check_contract.py tests/test_ci_pr_workflow_scopes.py"
                install=true
                ;;
              .github/workflows/dataset-harness.yml)
                core=true
                core_mode=ci-contract
                core_targets="tests/test_ci_pr_workflow_scopes.py"
                dataset=true
                ;;
              *)
                core=true
                core_mode=full
                core_targets=tests
                plugins=true
                plugin_scope_all=true
                packaging=true
                install=true
                dataset=true
                ;;
            esac
            # A deleted specialized workflow cannot be treated as a safe
            # workflow-only edit: its dedicated gate no longer exists.
            if [[ "$core_mode" == ci-contract ||
                  "$workflow_changed" == .github/workflows/dataset-harness.yml ]]; then
              if [[ ! -f "$workflow_changed" ]]; then
                echo "Specialized CI workflow was deleted: $workflow_changed" >&2
                exit 1
              fi
            fi
          fi

          python=false
          if [[ "$core" == true || "$plugins" == true || "$packaging" == true || "$install" == true || "$dataset" == true || "$bnf_reader" == true || "$lending_conformance" == true ]]; then
            python=true
          fi

          # The AST boundary scans production plugin files; skip it on docs-only
          # and unrelated Core/test changes, while keeping direct guard edits covered.
          httpx_boundary=false
          if matches '^(src/plugins/|scripts/ci_plugin_httpx_boundary\.py$|tests/test_ci_plugin_httpx_boundary\.py$|\.github/workflows/pr-ci\.yml$)'; then
            httpx_boundary=true
          fi

          {
            echo "core=$core"
            echo "core_mode=$core_mode"
            echo "core_targets=$core_targets"
            echo "plugins=$plugins"
            echo "plugin_targets=$plugin_targets"
            echo "packaging=$packaging"
            echo "install=$install"
            echo "dataset=$dataset"
            echo "python=$python"
            echo "httpx_boundary=$httpx_boundary"
            echo "bnf_reader=$bnf_reader"
            echo "lending_conformance=$lending_conformance"
            echo "branch_cleanup=$branch_cleanup"
            echo "recette=$recette"
          } >> "$GITHUB_OUTPUT"

      - name: Check production plugins use Core HTTPX service
        if: steps.scope.outputs.httpx_boundary == 'true'
        run: python3 scripts/ci_plugin_httpx_boundary.py

      - name: Stream branch cleanup safety tests (local bare Git)
        if: steps.scope.outputs.branch_cleanup == 'true'
        run: |
          test -f scripts/nettoyer_branches_git_stream.py
          test -f scripts/test_nettoyer_branches_git_stream.py
          python3 -m unittest -v scripts.test_nettoyer_branches_git_stream

      - name: Disposable recipe acceptance (real Linux confinement, synthetic data)
        if: steps.scope.outputs.recette == 'true'
        env:
          CIFERECA_REQUIRE_SANDBOX_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap dbus-x11 xvfb python3-venv apparmor-profiles apparmor-utils
          # Keep the Ubuntu global restriction enabled. Use the distribution's
          # bootstrap/child capability separation, never an unconfined profile.
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          ! grep -Eq 'flags=.*(unconfined|complain)|default_allow' "$profile"
          sudo apparmor_parser --skip-kernel-load --skip-cache "$profile"
          sudo apparmor_parser --replace "$profile"
          python3 scripts/recette-doctor.py --require-apparmor --profile "$profile"
          # A real mounted target, created only on this ephemeral runner.
          # Do not nest a bootstrap under AppArmor's capability-stripped child.
          volume="/media/cifereca-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo mkdir -m 0700 "$volume"
          trap 'sudo umount "$volume"; sudo rmdir "$volume"' EXIT
          sudo mount -t tmpfs -o "mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$volume"
          export CIFERECA_RECIPE_MOUNT_ROOT="$volume"
          python3 -m unittest discover -s tests -p test_recette_doctor.py -v
          python3 -m unittest discover -s tests -p test_recette.py -v
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Core test dependencies
        if: steps.scope.outputs.core == 'true'
        env:
          PLUGIN_TARGETS: ${{ steps.scope.outputs.plugin_targets }}
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12" "cryptography>=42,<48"
          if [[ "${{ steps.scope.outputs.plugins }}" == "true" ]] && \
             [[ -z "$PLUGIN_TARGETS" || " $PLUGIN_TARGETS " == *" src/plugins/epub_optimizer "* ]]; then
            python -m pip install --disable-pip-version-check "PyMuPDF>=1.26,<2"
          fi

      - name: Install plugin-only test dependencies
        if: (steps.scope.outputs.plugins == 'true' || steps.scope.outputs.lending_conformance == 'true') && steps.scope.outputs.core != 'true'
        env:
          PLUGIN_TARGETS: ${{ steps.scope.outputs.plugin_targets }}
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9" "httpx>=0.28.1,<0.29" "packaging>=24,<26" "Pillow>=10,<12" "cryptography>=42,<48"
          if [[ "${{ steps.scope.outputs.bnf_reader }}" == "true" || "${{ steps.scope.outputs.lending_conformance }}" == "true" ]]; then
            # The BnF acceptance suite exercises real Core SQLite persistence.
            python -m pip install --disable-pip-version-check -e .
          fi
          if [[ -z "$PLUGIN_TARGETS" || " $PLUGIN_TARGETS " == *" src/plugins/epub_optimizer "* ]]; then
            python -m pip install --disable-pip-version-check "PyMuPDF>=1.26,<2"
          fi

      - name: Run Core tests
        if: steps.scope.outputs.core == 'true'
        env:
          # Core regression tests load the Kobo provider directly from its file.
          # Match the provider's installed module scope without installing it.
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/plugins/provider-kobo
          CORE_TEST_MODE: ${{ steps.scope.outputs.core_mode }}
          CORE_TEST_TARGETS: ${{ steps.scope.outputs.core_targets }}
        run: |
          echo "Core test mode: $CORE_TEST_MODE"
          python -m pytest -q --durations=10 $CORE_TEST_TARGETS

      - name: BnF HTTPX reader acceptance (synthetic pages and SQLite)
        if: steps.scope.outputs.bnf_reader == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/ci_bnf_reader_gate.py run

      - name: Paris/BnF lending conformance (real adapters, synthetic data)
        if: steps.scope.outputs.lending_conformance == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/ci_lending_conformance_gate.py run

      - name: Run plugin tests
        if: steps.scope.outputs.plugins == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PLUGIN_TARGETS: ${{ steps.scope.outputs.plugin_targets }}
        run: |
          if [[ -n "$PLUGIN_TARGETS" ]]; then
            read -r -a targets <<< "$PLUGIN_TARGETS"
            bash scripts/ci-run-plugin-tests.sh "${targets[@]}"
          else
            bash scripts/ci-run-plugin-tests.sh
          fi

      - name: Validate plugin packaging
        if: steps.scope.outputs.packaging == 'true'
        run: |
          python scripts/verify-packaging.py
          python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release

      - name: Smoke installed Core wheel
        if: steps.scope.outputs.install == 'true'
        run: |
          python -m pip install --disable-pip-version-check "setuptools>=69" wheel
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          CIFERECA_EXPECTED_BUILD_SHA="$GITHUB_SHA" bash scripts/ci-smoke-installed-wheel.sh dist/cifereca-*.whl

      - name: Validate simulation dataset harness
        if: steps.scope.outputs.dataset == 'true'
        env:
          CIFERECA_DATASET_RUNTIME: /tmp/cifereca-datasets
        run: |
          python -m pip install --disable-pip-version-check "httpx>=0.28.1,<0.29" "packaging>=24,<26"
          python -m compileall -q simulation
          python -m unittest discover -s simulation/tests -v
          python simulation/datasetctl.py up ux-small
          trap 'python simulation/datasetctl.py down ux-small' EXIT
          python simulation/datasetctl.py status ux-small
          python simulation/datasetctl.py config ux-small
