name: PR CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: PR CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Temporary read-only inventory
        run: |
          echo '=== PROVIDER INVENTORY START ==='
          python3 -m scripts.ci_provider_core_coupling_inventory --json
          echo '=== KOBO INVENTORY START ==='
          python3 -m scripts.ci_kobo_core_line_inventory --json
          echo '=== INVENTORY END ==='
