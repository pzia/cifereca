name: P0 8216 repaired Core shards
on:
  pull_request:
    paths:
      - '.github/workflows/p0-8216-core-shard-repair.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4fd07df843b9d940746bbfe962a1877eec15d431
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence"
          mkdir -p "$out"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/src:$PWD/src/plugins/provider-kobo"
          git fetch origin e8ed298116e57d44645c37cd3fa7ad91e1e9077e
          test "$(git rev-parse FETCH_HEAD)" = e8ed298116e57d44645c37cd3fa7ad91e1e9077e
          git fetch origin 2e2d31ffc471553facb924ed32d1e7033503b73f
          test "$(git rev-parse FETCH_HEAD)" = 2e2d31ffc471553facb924ed32d1e7033503b73f
          git fetch origin 1db4a1203b5c644436fa804f652a60b372d82818
          test "$(git rev-parse FETCH_HEAD)" = 1db4a1203b5c644436fa804f652a60b372d82818
          git fetch origin 18af69e0b18c6a85461c9248a03c0d3e4fd3013c
          test "$(git rev-parse FETCH_HEAD)" = 18af69e0b18c6a85461c9248a03c0d3e4fd3013c
          git fetch origin c9db1c0f46535832ff15b395c4f8d9ab580d569f
          test "$(git rev-parse FETCH_HEAD)" = c9db1c0f46535832ff15b395c4f8d9ab580d569f
          git fetch origin 43dcbd706bf725308c683b0af1e10aa3b11d2ec6
          test "$(git rev-parse FETCH_HEAD)" = 43dcbd706bf725308c683b0af1e10aa3b11d2ec6
          python -m pip install -e . 'pytest>=8,<9' 'pytest-cov>=6,<8' 'Pillow>=10,<12' 'cryptography>=42,<48' pytest-xdist
          python -m pip freeze > "$out/dependencies.txt"
          for label in A B; do
            case "$label" in A) sha=4fd07df843b9d940746bbfe962a1877eec15d431;; B) sha=e8ed298116e57d44645c37cd3fa7ad91e1e9077e;; esac
            git checkout --detach "$sha"
            test "$(git rev-parse HEAD)" = "$sha"
            # Apply identical test-only isolation controls to both arms.
            git checkout 2e2d31ffc471553facb924ed32d1e7033503b73f -- tests/test_library_metadata_candidates.py tests/test_core_p1_1498_duplicate_cleanup_row_progress.py
            test "$(git rev-parse HEAD:tests/test_core_placement_observation_handoff.py)" = e371df65dfdba81be1d854b94c021da45a2cf651
            git checkout 1db4a1203b5c644436fa804f652a60b372d82818 -- tests/test_core_placement_observation_handoff.py
            test "$(git rev-parse :tests/test_core_placement_observation_handoff.py)" = 5f6b325ff81b8063d0b505ab6194a4cac1d905cc
            test "$(git rev-parse HEAD:tests/test_core_p0_2975_complete_digital_inventory.py)" = 43de2c2c7e0ef39ad3efbd17ef7b005087ad1550
            git checkout 18af69e0b18c6a85461c9248a03c0d3e4fd3013c -- tests/test_core_p0_2975_complete_digital_inventory.py
            test "$(git rev-parse :tests/test_core_p0_2975_complete_digital_inventory.py)" = 06233dd72522531c934491c1399d8f5d356abdf9
            test "$(git rev-parse HEAD:tests/test_core_p0_5843_adept_local_diagnostic.py)" = 33fe9d05ab915d5b1649ee5f1f324bd251d5aa99
            git checkout c9db1c0f46535832ff15b395c4f8d9ab580d569f -- tests/test_core_p0_5843_adept_local_diagnostic.py
            test "$(git rev-parse :tests/test_core_p0_5843_adept_local_diagnostic.py)" = a8b5006eb8a1100d2fdc7c13da51dda80e4f274c
            test "$(git rev-parse HEAD:tests/test_p1_4291_shared_transfer_placement.py)" = 94544e776734895d84d25099ee0d72120149b5c3
            git checkout 43dcbd706bf725308c683b0af1e10aa3b11d2ec6 -- tests/test_p1_4291_shared_transfer_placement.py
            test "$(git rev-parse :tests/test_p1_4291_shared_transfer_placement.py)" = 272434a0ab304fc832bb3013e31e912047079664
            git diff --cached --binary > "$out/$label.isolation.patch"
            if [ "$label" = B ]; then cmp "$out/A.isolation.patch" "$out/B.isolation.patch"; fi
            git rev-parse HEAD > "$out/$label.sha"
            git diff --cached --name-only > "$out/$label.changed"
            test "$(wc -l < "$out/$label.changed")" = 6
            python - <<'PY' > "$out/$label.files"
          import hashlib, os, subprocess
          paths=subprocess.check_output(["git","ls-files","tests"],text=True).splitlines()
          for p in paths:
              if p.endswith(".py") and p.rsplit("/",1)[-1].startswith("test") and int(hashlib.sha256(p.encode()).hexdigest(),16)%8==int(os.environ["SHARD"]):
                  print(p)
          PY
            mapfile -t files < "$out/$label.files"
            test "${#files[@]}" -gt 0
            /usr/bin/time -p -o "$out/$label.plain.time" python -m pytest -q -n 3 --dist=loadfile "${files[@]}" --junitxml="$out/$label.plain.xml" > "$out/$label.plain.log" 2>&1 || { tail -c 16000 "$out/$label.plain.log"; exit 1; }
            tail -c 2000 "$out/$label.plain.log"
            mkdir -p "$RUNNER_TEMP/coverage-data/$label"
            export COVERAGE_FILE="$RUNNER_TEMP/coverage-data/$label/.coverage"
            /usr/bin/time -p -o "$out/$label.coverage.time" python -m pytest -q -n 3 --dist=loadfile "${files[@]}" --cov=src/cifereca --cov-branch --cov-context=test --cov-report= --junitxml="$out/$label.coverage.xml" > "$out/$label.coverage.log" 2>&1 || { tail -c 16000 "$out/$label.coverage.log"; exit 1; }
            tail -c 2000 "$out/$label.coverage.log"
            test -z "$(git diff --name-only)"
            git diff --cached --binary > "$out/$label.final.patch"
            cmp "$out/$label.isolation.patch" "$out/$label.final.patch"
            git reset --hard "$sha"
            test -s "$COVERAGE_FILE"
            cp "$COVERAGE_FILE" "$out/$label.coverage"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-core-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          include-hidden-files: true
          retention-days: 7
