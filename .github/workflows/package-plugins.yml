name: Package plugins

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate plugin source tree
        run: python scripts/verify-packaging.py

      - name: Test packaging scripts
        run: python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release

      - name: Build all-in-one bundle
        run: python scripts/package-all-in-one.py

      - name: Build cifereca-update-dev snapshot
        run: python scripts/package-dev-snapshot.py

      - name: Verify exact distribution archives
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=12 HEAD)"
          for archive in "dist/cifereca-dev-plugins-$sha.zip" "dist/cifereca-plugins-all-in-one-$sha.zip"; do
            test -s "$archive"
            unzip -tqq "$archive"
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cifereca-plugin-packages
          # Only the two reviewed build products; never archive the entire
          # dist directory or an unrelated ZIP dropped by a future step.
          path: |
            dist/cifereca-dev-plugins-${{ steps.archives.outputs.sha }}.zip
            dist/cifereca-plugins-all-in-one-${{ steps.archives.outputs.sha }}.zip
          if-no-files-found: error
          retention-days: 2
