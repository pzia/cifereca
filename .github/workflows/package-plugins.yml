name: Package plugins

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate plugin source tree
        run: python scripts/verify-packaging.py

      - name: Test packaging scripts
        run: python -m unittest scripts.test_plugin_packaging scripts.test_partial_plugin_release

      - name: Build all-in-one bundle
        run: python scripts/package-all-in-one.py

      - name: Build cifereca-update-dev snapshot
        run: python scripts/package-dev-snapshot.py

      - name: List artifacts
        run: unzip -l dist/cifereca-dev-plugins-*.zip | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: cifereca-plugin-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
