name: Browser Recorder · synthetic Chromium E2E

# P1 #2531. This job visits ONLY a fake in-process localhost server.
# Never pass a real domain, account, token, session, DRM link or user capture.
on:
  pull_request:
    paths:
      - 'src/plugins/browser-recorder/**'
      - '.github/workflows/browser-recorder-chromium-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-recorder-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Real Chromium · fake local bookstore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test runtime
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Real Playwright E2E with synthetic localhost ONLY
        env:
          PYTHONPATH: ${{ github.workspace }}/src/plugins/browser-recorder
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a python -m pytest -q -rs \
            src/plugins/browser-recorder/tests/test_browser_recorder_chromium_e2e.py
      - name: Publish no private artifacts
        if: always()
        run: |
          echo 'Synthetic HTTP fixture only; no screenshots, HAR, ZIP, browser profile, cookies or session artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"

  gtk:
    name: Real GTK4 · reviewed ZIP controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native GTK4/PyGObject/Xvfb test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 python3-pytest xvfb xauth xdotool
      - name: Native GTK4 page, XTEST keyboard and ZIP review with synthetic RAM trace
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/plugins/browser-recorder
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; assert Gtk is not None'
          xvfb-run -a /usr/bin/python3 -m pytest -q -rs \
            src/plugins/browser-recorder/tests/test_browser_recorder_gtk_e2e.py \
            src/plugins/browser-recorder/tests/test_browser_recorder_gtk_xtest.py
      - name: Never upload private UI data
        if: always()
        run: |
          echo 'Synthetic local GTK values only; no screenshots, traces, or ZIP outputs published.' >> "$GITHUB_STEP_SUMMARY"
