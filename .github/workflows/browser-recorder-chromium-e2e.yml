name: Browser Recorder · synthetic Chromium E2E

# P1 #2531. This job visits ONLY a fake in-process localhost server.
# Never pass a real domain, account, token, session, DRM link or user capture.
on:
  pull_request:
    paths:
      - 'src/plugins/browser-recorder/**'
      - '.github/workflows/browser-recorder-chromium-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-recorder-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Real Chromium · fake local bookstore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test runtime
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Real Playwright E2E with synthetic localhost ONLY
        env:
          PYTHONPATH: ${{ github.workspace }}/src/plugins/browser-recorder
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a python -m pytest -q -rs \
            src/plugins/browser-recorder/tests/test_browser_recorder_chromium_e2e.py
      - name: Publish no private artifacts
        if: always()
        run: |
          echo 'Synthetic HTTP fixture only; no screenshots, HAR, ZIP, browser profile, cookies or session artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"
