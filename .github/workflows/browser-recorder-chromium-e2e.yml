name: Browser Recorder · synthetic Chromium E2E

# P0 #2531/#2628. Synthetic browser navigation is localhost-only.
# Opt-in Chromium provisioning E2E may contact the official Playwright CDN;
# never use a real provider, account, token, session, DRM link or user capture.
on:
  pull_request:
    paths:
      - 'src/plugins/browser-recorder/**'
      - 'tests/test_browser_recorder_installed_gtk_blackbox.py'
      - 'tests/test_browser_recorder_installed_chromium_e2e.py'
      - 'tests/test_browser_recorder_chromium_sigkill_e2e.py'
      - 'tests/test_browser_recorder_three_chromium_sessions_e2e.py'
      - 'tests/test_browser_recorder_full_app_restart_e2e.py'
      - 'tests/test_core_p0_2628_real_gtk_optin_chromium_e2e.py'
      # Every real Chromium provisioning recipe must run in the dedicated
      # browser runtime, not only the generic PR CI (which cannot prove CDN).
      - 'tests/test_core_p0_2628_real_*.py'
      - 'tests/test_core_p0_2628_gtk_xtest_cancel_inflight.py'
      - '.github/workflows/browser-recorder-chromium-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-recorder-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Real Chromium · fake local bookstore
    runs-on: ubuntu-24.04
    # The clean-room runner installs multiple isolated Python/GTK/Chromium
    # environments and exercises real CDN provisioning. The suite passed its
    # functional cases but GitHub previously cancelled final cleanup at 15 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test runtime
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "playwright>=1.50,<2" "cryptography>=42,<48"
          python -m playwright install --with-deps chromium
      - name: Real Playwright CLI through refusing localhost proxy (no external download)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python -m venv --system-site-packages "$RUNNER_TEMP/proxy-core-venv"
          "$RUNNER_TEMP/proxy-core-venv/bin/python" -m pip show playwright >/dev/null
          mkdir -p "$RUNNER_TEMP/empty-proxy-home"
          test ! -e "$RUNNER_TEMP/empty-proxy-home/.cache/ms-playwright"
          env -u PLAYWRIGHT_BROWSERS_PATH \
              -u PLAYWRIGHT_DOWNLOAD_HOST \
              -u PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST \
              HOME="$RUNNER_TEMP/empty-proxy-home" \
              CIFERECA_REAL_CHROMIUM_PROVISION_E2E=1 \
              "$RUNNER_TEMP/proxy-core-venv/bin/python" -m pytest -q -rs \
              tests/test_core_p0_2628_real_proxy_failure_e2e.py
      - name: 'Real Playwright CLI — cancelled cold-cache CDN attempt then successful retry'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-cancel-home"
          test ! -e "$RUNNER_TEMP/empty-cancel-home/.cache/ms-playwright"
          env -u PLAYWRIGHT_BROWSERS_PATH \
              -u PLAYWRIGHT_DOWNLOAD_HOST \
              -u PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST \
              HOME="$RUNNER_TEMP/empty-cancel-home" \
              CIFERECA_REAL_CDN_CANCEL_E2E=1 \
              "$RUNNER_TEMP/proxy-core-venv/bin/python" -m pytest -q -rs \
              tests/test_core_p0_2628_real_cdn_cancel_retry_e2e.py
      - name: Real Playwright E2E with synthetic localhost ONLY
        env:
          PYTHONPATH: ${{ github.workspace }}/src/plugins/browser-recorder
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a python -m pytest -q -rs \
            src/plugins/browser-recorder/tests/test_browser_recorder_chromium_e2e.py
      - name: Native GTK4 installed plugin plus real headed Chromium on localhost fixture
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 python3-pytest python3-venv python3-cryptography python3-httpx
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/installed-browser-venv"
          "$RUNNER_TEMP/installed-browser-venv/bin/python" -m pip install --disable-pip-version-check 'playwright>=1.50,<2' 'cryptography>=42,<48'
          "$RUNNER_TEMP/installed-browser-venv/bin/python" -m playwright install chromium
          xvfb-run -a "$RUNNER_TEMP/installed-browser-venv/bin/python" -m pytest -q -rs \
            tests/test_browser_recorder_installed_chromium_e2e.py \
            tests/test_browser_recorder_chromium_sigkill_e2e.py
      - name: Three headed Chromium sessions, manager restart, two reviewed ZIPs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          # New pytest interpreter, no previously loaded installed plugin.
          xvfb-run -a "$RUNNER_TEMP/installed-browser-venv/bin/python" -m pytest -q -rs \
            tests/test_browser_recorder_three_chromium_sessions_e2e.py
      - name: Full Cifereca executable twice + local vault (no real user data)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xdotool dbus-x11 gir1.2-adw-1 openbox
          "$RUNNER_TEMP/installed-browser-venv/bin/python" -m pip install --disable-pip-version-check -e .
          xvfb-run -a "$RUNNER_TEMP/installed-browser-venv/bin/python" -m pytest -q -rs \
            tests/test_browser_recorder_full_app_restart_e2e.py
      - name: Publish no private artifacts
        if: always()
        run: |
          echo 'Synthetic HTTP fixture only; no screenshots, HAR, ZIP, browser profile, cookies or session artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"

  gtk:
    name: Real GTK4 · reviewed ZIP controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native GTK4/PyGObject/Xvfb test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-pytest python3-venv python3-cryptography python3-httpx xvfb xauth xdotool
      - name: Native GTK4 page, XTEST keyboard and ZIP review with synthetic RAM trace
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/plugins/browser-recorder
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; assert Gtk is not None'
          xvfb-run -a /usr/bin/python3 -m pytest -q -rs \
            src/plugins/browser-recorder/tests/test_browser_recorder_gtk_e2e.py \
            src/plugins/browser-recorder/tests/test_browser_recorder_gtk_xtest.py \
            src/plugins/browser-recorder/tests/test_browser_recorder_gtk_xtest_review.py \
            src/plugins/browser-recorder/tests/test_browser_recorder_private_zip_gtk.py \
            src/plugins/browser-recorder/tests/test_browser_recorder_vault_index_gtk.py
      - name: Install actual plugin ZIP in isolated GTK venv and open Core contribution
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/recorder-gtk-venv"
          "$RUNNER_TEMP/recorder-gtk-venv/bin/python" -m pip install --disable-pip-version-check 'playwright>=1.50,<2' 'cryptography>=42,<48'
          xvfb-run -a "$RUNNER_TEMP/recorder-gtk-venv/bin/python" -m pytest -q -rs \
            tests/test_browser_recorder_installed_gtk_blackbox.py
          # Cancellation uses the real GTK/XTEST UI with a controllable,
          # blocked fake installer; never deliberately interrupt the CDN.
          xvfb-run -a "$RUNNER_TEMP/recorder-gtk-venv/bin/python" -m pytest -q -rs \
            tests/test_core_p0_2628_gtk_xtest_cancel_inflight.py
      - name: Fresh Plugins GUI XTEST opt-in (no preinstalled Python Playwright)
        env:
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/fresh-ui-venv"
          "$RUNNER_TEMP/fresh-ui-venv/bin/python" -m pip install --disable-pip-version-check -e . 'pytest>=8,<9'
          if "$RUNNER_TEMP/fresh-ui-venv/bin/python" -m pip show playwright >/dev/null 2>&1; then
            echo 'Fresh GUI unexpectedly contains Playwright before consent' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/empty-ui-home"
          test ! -e "$RUNNER_TEMP/empty-ui-home/.cache/ms-playwright"
          env -u PLAYWRIGHT_BROWSERS_PATH \
              -u PLAYWRIGHT_DOWNLOAD_HOST \
              -u PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST \
              HOME="$RUNNER_TEMP/empty-ui-home" \
              CIFERECA_REAL_CHROMIUM_PROVISION_E2E=1 \
              xvfb-run -a "$RUNNER_TEMP/fresh-ui-venv/bin/python" -m pytest -q -rs \
              tests/test_core_p0_2628_real_gtk_optin_chromium_e2e.py
      - name: Never upload private UI data
        if: always()
        run: |
          echo 'Synthetic local GTK values only; no screenshots, traces, or ZIP outputs published.' >> "$GITHUB_STEP_SUMMARY"
