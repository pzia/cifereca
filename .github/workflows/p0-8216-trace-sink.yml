name: P0 8216 trace sink mutation
on:
  pull_request:
    paths:
      - '.github/workflows/p0-8216-trace-sink.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 7aa2fd077f9fbd21b9b1e2e0a15f4aaf3d218ead
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest Pillow cryptography
      - shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          git fetch origin focus/8216-trace-sink-oracle
          test "$(git rev-parse FETCH_HEAD)" = 04b7b6f1df38cdb2a3ce8bcb7e97a1c26756532c
          path=tests/test_core_p0_3909_correlated_flow_trace.py
          node="$path::test_trace_sink_failure_is_non_blocking"
          python -m pytest -q "$node"
          git checkout FETCH_HEAD -- "$path"
          python -m pytest -q "$node"
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("src/cifereca/core/canonical_flow_trace.py")
          s=p.read_text()
          tree=ast.parse(s)
          cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="CanonicalFlowTrace")
          fn=next(n for n in cls.body if isinstance(n,ast.FunctionDef) and n.name=="emit")
          lines=s.splitlines(keepends=True)
          i=fn.body[0].lineno-1
          lines.insert(i,"        return None\n")
          p.write_text("".join(lines))
          PY
          git checkout 7aa2fd077f9fbd21b9b1e2e0a15f4aaf3d218ead -- "$path"
          python -m pytest -q "$node"
          git checkout FETCH_HEAD -- "$path"
          set +e
          python -m pytest -q "$node"
          rc=$?
          set -e
          test "$rc" = 1
