name: Temporary provider LOC inventory
on:
  pull_request:
    paths:
      - ".github/workflows/temp-provider-loc.yml"
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Provider LOC inventory
        run: |
          python scripts/ci_provider_core_coupling_inventory.py --json > /tmp/report.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/report.json'))
          keys = ('dedicated_lines', 'dedicated_files', 'dedicated_by_provider', 'generic_files_with_provider_literal', 'generic_provider_literal_lines_unique', 'parse_errors')
          print('PROVIDER_CORE_LOC_RESULT=' + json.dumps({k: x[k] for k in keys}, sort_keys=True))
          print('PARIS_DEDICATED_FILES=' + json.dumps({k: v for k,v in x['dedicated_per_file'].items() if v['provider'] == 'paris'}, sort_keys=True))
          PY
