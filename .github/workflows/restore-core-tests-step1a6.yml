name: Restore Core tests step 1A6

on:
  push:
    branches:
      - rationalization/core-tests-step1a6
    paths:
      - '.restore-tests-step1a6/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .restore-tests-step1a6 -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 2
          cat .restore-tests-step1a6/payload.b64.part.* | base64 -d > /tmp/core-tests-step1a6.tar.xz
          echo "5017b843a39ced145c526847f97d1e3c7741a7561c1ec84d46bfa690a342c2f6  /tmp/core-tests-step1a6.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a6.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_core_0919.py             tests/test_core_iteration_097_dev3.py             tests/test_history_covers.py             tests/test_identities_081.py

          rm -rf .restore-tests-step1a6
          rm -f .github/workflows/restore-core-tests-step1a6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A6'
          git push origin HEAD:rationalization/core-tests-step1a6
