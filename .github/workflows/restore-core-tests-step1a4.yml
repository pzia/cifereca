name: Restore Core tests step 1A4

on:
  push:
    branches:
      - rationalization/core-tests-step1a4
    paths:
      - '.restore-tests-step1a4/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .restore-tests-step1a4 -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 2
          cat .restore-tests-step1a4/payload.b64.part.* | base64 -d > /tmp/core-tests-step1a4.tar.xz
          echo "aec21aaed061d686e01e7a9408d2e6fd212925d6f0acd6dab459e5ffd2c87774  /tmp/core-tests-step1a4.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a4.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_core039_iteration1.py             tests/test_core041_artifact_authority.py             tests/test_core042_library_ui.py             tests/test_core043_progress_cache_stats.py

          rm -rf .restore-tests-step1a4
          rm -f .github/workflows/restore-core-tests-step1a4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A4'
          git push origin HEAD:rationalization/core-tests-step1a4
