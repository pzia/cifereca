name: Validate full Core release install
on:
  pull_request:
    paths:
      - ".github/workflows/core-full-install.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-install:
    name: Temporary provider Core LOC count
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Count provider LOC
        run: |
          python scripts/ci_provider_core_coupling_inventory.py --json > /tmp/provider-core-loc.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/provider-core-loc.json'))
          keys=('dedicated_lines','dedicated_files','dedicated_by_provider','generic_files_with_provider_literal','generic_provider_literal_lines_unique','parse_errors')
          print('PROVIDER_CORE_LOC_RESULT='+json.dumps({k:r[k] for k in keys},sort_keys=True))
          print('PARIS_FILES='+json.dumps({k:v for k,v in r['dedicated_per_file'].items() if v['provider']=='paris'},sort_keys=True))
          PY
