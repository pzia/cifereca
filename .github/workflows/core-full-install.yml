name: Validate full Core release install

on:
  pull_request:
    paths:
      - "src/cifereca/**"
      - "src/plugins/*/cifereca-plugin.json"
      - "scripts/ci-full-release-install-gate.py"
      - "scripts/prepare-admitted-wheelhouse.py"
      - "scripts/plugin_packaging.py"
      - "scripts/package-dev-snapshot.py"
      - "scripts/verify-packaging.py"
      - "pyproject.toml"
      - "VERSION"
      - ".github/workflows/core-full-install.yml"
  push:
    branches: [main]
    paths:
      - "src/cifereca/**"
      - "src/plugins/*/cifereca-plugin.json"
      - "scripts/ci-full-release-install-gate.py"
      - "scripts/plugin_packaging.py"
      - "scripts/package-dev-snapshot.py"
      - "scripts/verify-packaging.py"
      - "pyproject.toml"
      - "VERSION"
      - ".github/workflows/core-full-install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-core-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-install:
    name: Full source install and Core rollback (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging prerequisites
        run: |
          python -m pip install --disable-pip-version-check "setuptools>=69" wheel "packaging>=24,<26" "httpx>=0.28.1,<0.29"

      - name: Prepare attested offline wheels for full updater test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/prepare-admitted-wheelhouse.py

      - name: Exercise full release and Core rollback
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/ci-full-release-install-gate.py
