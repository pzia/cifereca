name: Validate full Core release install
on:
  pull_request:
    paths:
      - ".github/workflows/core-full-install.yml"
permissions:
  contents: read
jobs:
  full-install:
    name: Temporary latest Core/provider LOC inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Count expanded provider LOC
        run: |
          PYTHONPATH=. python - <<'PY'
          import pathlib,ast,json,collections
          from scripts.ci_provider_core_coupling_report import extended_inventory,_installed_provider_aliases,_SIGNAL_KINDS
          from scripts.ci_provider_core_coupling_inventory import inspect_source,_dedicated_provider
          root=pathlib.Path.cwd()
          r=extended_inventory(root)
          aliases=_installed_provider_aliases(root)
          per=collections.defaultdict(lambda:collections.Counter())
          modules=collections.defaultdict(list)
          ast_family=collections.defaultdict(set)
          def family(a):
              a=a.lower()
              if 'biblioaccess' in a:return 'BiblioAccess'
              if 'bnf' in a:return 'BnF (combined)'
              if 'kobo' in a:return 'Kobo'
              if 'numilog' in a:return 'Numilog'
              if 'paris' in a:return 'Paris'
              if 'gallica' in a:return 'Gallica'
              if 'gutenberg' in a:return 'Gutenberg'
              if 'ebooksgratuits' in a:return 'EbooksGratuits'
              if 'baen' in a:return 'Baen'
              return None
          for p in sorted((root/'src/cifereca').rglob('*.py')):
              rel=p.relative_to(root).as_posix()
              if rel in r['historical']['parse_errors']:continue
              source=p.read_text(encoding='utf-8')
              loc=len(source.splitlines())
              dedicated=_dedicated_provider(p.relative_to(root))
              if dedicated:
                  fam=family(dedicated)
                  if fam:per[fam]['dedicated_legacy']+=loc;modules[fam].append([rel,loc,'legacy'])
                  continue
              if rel in r['vendor_named_modules_outside_legacy_dedicated_scope']:
                  fam=next((family(n) for n in ['bnf','kobo','numilog','paris','biblioaccess'] if p.stem.startswith(n+'_') or p.stem==n),None)
                  if fam:per[fam]['dedicated_additional']+=loc;modules[fam].append([rel,loc,'additional'])
                  continue
              matches=inspect_source(source,providers=aliases)
              for kind in _SIGNAL_KINDS:
                  for entry in matches[kind]:
                      for a in entry['providers']:
                          fam=family(a)
                          if fam:ast_family[fam].add((rel,entry['line']))
          for fam,values in ast_family.items():per[fam]['generic_ast_unique_lines']=len(values)
          output={
              'historic':r['historical'],
              'expanded':r['expanded_named_modules'],
              'remaining_generic':r['remaining_generic_after_expanded_named_scope'],
              'total_core_files':r['total_core_python_files'],
              'core_physical_loc':r['total_core_python_physical_lines'],
              'provider_types':{k:dict(v) for k,v in sorted(per.items())},
              'named_modules':{k:v for k,v in sorted(modules.items())},
              'top_generic':r['top_generic_by_ast_signal'][:12],
              'parse_errors':r['historical']['parse_errors'],
          }
          print('DECOUPLING_LOC_MATRIX='+json.dumps(output,ensure_ascii=False,sort_keys=True))
          PY
