name: Validate full Core release install
on:
  pull_request:
    paths:
      - ".github/workflows/core-full-install.yml"
permissions:
  contents: read
jobs:
  full-install:
    name: Temporary complete pytest collection inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12" "cryptography>=42,<48" "PyMuPDF>=1.26,<2"
      - name: Collect Core and each plugin without executing tests
        run: python scripts/_temp_test_inventory.py > /tmp/test_inventory.log
      - name: Print collected counts
        run: cat /tmp/test_inventory.log
