name: Validate full Core release install
on:
  pull_request:
    paths:
      - ".github/workflows/core-full-install.yml"
permissions:
  contents: read
jobs:
  full-install:
    name: Temporary v2 Core LOC audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate report and expose summary
        run: |
          python -m pytest -q tests/test_core_p0_5048_provider_coupling_report.py tests/test_core_p0_5048_provider_line_inventory.py
          python scripts/ci_provider_core_coupling_report.py --json > /tmp/core-v2.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/core-v2.json'))
          fields=('historical','total_core_python_files','total_core_python_physical_lines','line_partition','generic_ast_signal_occurrences_by_kind','generic_ast_signal_occurrences_by_provider_alias','generic_reported_files','top_generic_by_ast_signal')
          obj={k:r[k] for k in fields}
          obj['top_generic_by_ast_signal']=obj['top_generic_by_ast_signal'][:18]
          obj['vendor_named_modules_outside_legacy_dedicated_scope']=r['vendor_named_modules_outside_legacy_dedicated_scope']
          print('PROVIDER_V2_REPORT='+json.dumps(obj,sort_keys=True))
          PY
