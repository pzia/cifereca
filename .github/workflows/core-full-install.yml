name: Validate full Core release install
on:
  pull_request:
    paths:
      - ".github/workflows/core-full-install.yml"
permissions:
  contents: read
jobs:
  full-install:
    name: Temporary repository structural audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect tracked layout and plugin imports
        run: |
          python - <<'PY'
          import subprocess,collections,json,pathlib,ast
          fs=subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0')
          print('AUDIT_BEGIN')
          print('TOTAL_TRACKED='+str(len(fs)))
          for depth in (1,2,3):
              groups=collections.Counter('/'.join(p.split('/')[:depth]) for p in fs)
              if depth==1: print('ROOT='+json.dumps(groups.most_common(),ensure_ascii=False))
              if depth==2: print('LEVEL2='+json.dumps([(k,v) for k,v in sorted(groups.items()) if k.startswith(('src/','docs/','tests/','simulation/','scripts/','e2e/','environnements/'))],ensure_ascii=False))
              if depth==3: print('LEVEL3_SRC='+json.dumps([(k,v) for k,v in sorted(groups.items()) if k.startswith(('src/cifereca/','src/plugins/'))],ensure_ascii=False))
          for root in ('src/cifereca/core/','src/cifereca/kobo/','src/cifereca/paris/','src/cifereca/providers/','src/cifereca/plugin_api/'):
              print('FILES '+root+'='+json.dumps([x.removeprefix(root) for x in fs if x.startswith(root)],ensure_ascii=False))
          for root in ('src/plugins/','docs/','tests/'):
              p=[x for x in fs if x.startswith(root)]
              matches=[x for x in p if any(y in x.lower() for y in ('legacy','right','entitle','manifest','backup','reconcil','bnf','kobo','numilog','paris','provider'))]
              print('MATCHES '+root+'='+json.dumps(matches[:270],ensure_ascii=False)+' COUNT='+str(len(matches)))
          pkgs=collections.Counter(x.split('/')[2] for x in fs if x.startswith('src/plugins/') and len(x.split('/'))>2)
          print('PLUGIN_PACKAGES='+json.dumps(pkgs.most_common(),ensure_ascii=False))
          special=[]
          for p in fs:
              if p.endswith('.py') and p.startswith('src/plugins/'):
                  s=pathlib.Path(p).read_text(errors='replace')
                  try: t=ast.parse(s)
                  except SyntaxError: continue
                  for n in ast.walk(t):
                      mod=''
                      if isinstance(n,ast.ImportFrom): mod=n.module or ''
                      elif isinstance(n,ast.Import): mod=','.join(a.name for a in n.names)
                      if mod.startswith(('cifereca.core','cifereca.storage','cifereca.services','cifereca.gui','cifereca.kobo','cifereca.paris')):
                          special.append((p,n.lineno,mod))
          print('PRIVATE_PLUGIN_IMPORTS='+json.dumps(special[:150],ensure_ascii=False)+' COUNT='+str(len(special)))
          print('AUDIT_END')
          PY
