name: Restore Core tests step 1A12

on:
  push:
    branches:
      - rationalization/core-tests-step1a12
    paths:
      - '.restore-tests-step1a12/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate regressions 0.9.9 test
        shell: bash
        run: |
          set -euo pipefail
          cp .restore-tests-step1a12/payload.tar.xz /tmp/core-tests-step1a12.tar.xz
          echo "7f08308569c1787eaa768caf829ca1e4f57d62d43b772527ec512efda695a92b  /tmp/core-tests-step1a12.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a12.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q tests/test_regressions_099.py

          rm -rf .restore-tests-step1a12
          rm -f .github/workflows/restore-core-tests-step1a12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore regressions 0.9.9 Core tests'
          git push origin HEAD:rationalization/core-tests-step1a12
