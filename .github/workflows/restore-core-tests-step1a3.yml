name: Restore Core tests step 1A3

on:
  push:
    branches:
      - rationalization/core-tests-step1a3
    paths:
      - '.restore-tests-step1a3/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .restore-tests-step1a3 -maxdepth 1 -type f -name 'payload.b64.part.*' | wc -l)" -eq 3
          cat .restore-tests-step1a3/payload.b64.part.* | base64 -d > /tmp/core-tests-step1a3.tar.xz
          echo "df8f1e31b974203ccee9d21c25343e06be7560fc7ee05b5a121df806ec583c0e  /tmp/core-tests-step1a3.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a3.tar.xz -C .

          python -m pip install -e '.[dev]' 'Pillow>=10,<12'
          timeout 90s python -m pytest -q             tests/test_acquisition.py             tests/test_acquisition_engine_080.py             tests/test_catalog_083.py             tests/test_core037_python_dependencies.py

          rm -rf .restore-tests-step1a3
          rm -f .github/workflows/restore-core-tests-step1a3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A3'
          git push origin HEAD:rationalization/core-tests-step1a3
