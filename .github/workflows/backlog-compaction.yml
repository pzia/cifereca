name: Backlog compaction

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issues:
        description: One to three closed issue numbers (read-only audit)
        required: true
        type: string

permissions: {}

jobs:
  audit:
    if: github.repository == 'pzia/cifereca' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only audit
        env:
          ISSUES: ${{ inputs.issues }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/backlog_compaction.py audit --issues="$ISSUES"

  closure:
    if: >-
      github.repository == 'pzia/cifereca' && github.ref == 'refs/heads/main' &&
      github.event_name == 'issues' && github.event.action == 'closed' &&
      github.run_attempt == 1 && github.actor == 'pzia' && github.triggering_actor == 'pzia' &&
      github.event.sender.id == 11092036 && github.event.issue.state_reason == 'completed' &&
      ((contains(github.event.issue.labels.*.name, 'P0') &&
        contains(github.event.issue.body, '<!-- backlog-staging-v1:')) ||
       startsWith(github.event.issue.title, 'Capitalisation #8195 — ') ||
       startsWith(github.event.issue.title, 'Réception consolidation #8195 — ') ||
       startsWith(github.event.issue.title, 'Lot consolidation #8195 — ') ||
       startsWith(github.event.issue.title, 'Poursuite consolidation #8195 — ') ||
       startsWith(github.event.issue.title, 'Nouvelle consolidation #8195 — '))
    concurrency:
      group: backlog-compaction
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline safety tests
        run: python3 -m unittest discover -s tests -p test_backlog_compaction.py
      - name: Verify staging and consolidate or purge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/backlog_compaction.py closure
