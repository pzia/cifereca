name: BnF Prêt - ZIP de test
on:
  pull_request:
    paths:
      - "src/plugins/provider-bnf-pret/**"
      - "scripts/test-bnf-pret-local.sh"
      - "scripts/package-plugin.py"
      - "scripts/plugin_packaging.py"
      - ".github/workflows/bnf-pret-test-package.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-test-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging validator requirements
        run: python -m pip install "packaging>=24,<26"
      - name: Build and validate the official installable ZIP
        run: python scripts/package-plugin.py src/plugins/provider-bnf-pret --out dist
      - name: Validate shell launcher's syntax
        run: bash -n scripts/test-bnf-pret-local.sh
      - name: Publish the user-installable BnF test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bnf-pret-web-tester-zip
          path: dist/cifereca-plugin-provider-bnf-pret-*.zip
          if-no-files-found: error
          retention-days: 7
