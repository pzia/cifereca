name: P0 Publication · PDF retirement reader receipt

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cifereca/core/derived_variant_pdf_reader.py'
      - 'src/cifereca/core/derived_variant_private_retirement.py'
      - 'src/cifereca/core/derived_variant_retirement_preparation.py'
      - 'tests/test_core_p0_6937_private_retirement.py'
      - '.github/workflows/p0-publication-pdf-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-publication-pdf-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install existing optional PDF test dependency
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "Pillow>=10,<12" "cryptography>=42,<48" "PyMuPDF>=1.26,<2"
          python -I -c 'import pymupdf'
      - name: Mandatory positive and negative synthetic PDF receipt
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q -rA --junitxml=pdf-receipt.xml \
            tests/test_core_p0_6937_private_retirement.py::test_optional_pdf_reader_receipt_through_isolated_retirement \
            tests/test_core_p0_6937_private_retirement.py::test_real_pdf_reader_negative_boundary
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("pdf-receipt.xml").getroot().findall(".//testcase")
          assert len(cases) == 3, "expected exactly three PDF receipt cases"
          assert all(not any(c.find(tag) is not None for tag in ("skipped", "failure", "error")) for c in cases), "PDF receipt not fully executed"
          PY
