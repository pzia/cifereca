name: Restore Core tests step 1A8

on:
  push:
    branches:
      - rationalization/core-tests-step1a8
    paths:
      - '.restore-tests-step1a8/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate Core tests
        shell: bash
        run: |
          set -euo pipefail
          cp .restore-tests-step1a8/payload.tar.xz /tmp/core-tests-step1a8.tar.xz
          echo "f399a081499d805f92c6011a7c5544253653f3eeaae107195bfc28b884d2047b  /tmp/core-tests-step1a8.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a8.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q             tests/test_cifereca_step_a.py             tests/test_cifereca_step_b.py             tests/test_install_helpers_097.py             tests/test_plugin_cards_097_dev4.py

          rm -rf .restore-tests-step1a8
          rm -f .github/workflows/restore-core-tests-step1a8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Core regression tests step 1A8'
          git push origin HEAD:rationalization/core-tests-step1a8
