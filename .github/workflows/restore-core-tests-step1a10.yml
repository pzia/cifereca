name: Restore Core tests step 1A10

on:
  push:
    branches:
      - rationalization/core-tests-step1a10
    paths:
      - '.restore-tests-step1a10/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and validate provider federation Core tests
        shell: bash
        run: |
          set -euo pipefail
          cp .restore-tests-step1a10/payload.tar.xz /tmp/core-tests-step1a10.tar.xz
          echo "82839297a9e29b157b7952b719a6d8b800ba5a1de82d39290d248311bf4a3cf7  /tmp/core-tests-step1a10.tar.xz" | sha256sum -c -
          tar -xJf /tmp/core-tests-step1a10.tar.xz -C .

          python -m pip install -e '.[dev]'
          timeout 90s python -m pytest -q tests/test_provider_plugins.py

          rm -rf .restore-tests-step1a10
          rm -f .github/workflows/restore-core-tests-step1a10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore provider federation Core regression tests'
          git push origin HEAD:rationalization/core-tests-step1a10
