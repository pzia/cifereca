name = "ux-small"
description = "Recette rapide : petits volumes sur tous les faux services."

[runtime]
startup_timeout_seconds = 20

[cifereca]
binary = "cifereca"
no_plugins = true
force_plugins = ["ui.page.home"]
width = 1300
height = 850

[library]
epubs = 100
seed = 20261006

[services.opds]
enabled = true
books_per_source = 250
seed = 20261006

[services.bnf]
enabled = true
books = 500
seed = 20261006

[services.kobo]
enabled = true
catalog_books = 500
vault_books = 100
seed = 20261006

[services.paris]
enabled = true
books = 500
active_loans = 30
history_items = 50
bookings = 15
digital_ratio = 0.70
seed = 20261006

[services.numilog]
enabled = true
books = 200
page_size = 50
seed = 20261006
