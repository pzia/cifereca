name = "ux-small"
description = "Recette rapide : petits volumes sur tous les faux services."

[runtime]
startup_timeout_seconds = 20

[cifereca]
binary = "cifereca"
no_plugins = true
force_plugins = ["ui.page.home"]
width = 1300
height = 850

[[identities]]
id = "ux"
label = "Camille"
directory_name = "camille"
reading_languages = ["fr"]
epubs = 70
seed = 20261006

[[identities]]
id = "ux-secondary"
label = "Alexandre"
directory_name = "alexandre"
reading_languages = ["fr", "en"]
epubs = 30
seed = 20261007

[library]
provider_dir = "local"

[services.opds]
enabled = true
books_per_source = 250
seed = 20261006

[services.bnf]
enabled = true
books = 500
seed = 20261006

[services.kobo]
enabled = true
catalog_books = 500
vault_books = 100
seed = 20261006

[services.paris]
enabled = true
books = 500
active_loans = 30
history_items = 50
bookings = 15
digital_ratio = 0.70
seed = 20261006

[services.numilog]
enabled = true
books = 200
page_size = 50
seed = 20261006

# Service déjà implémenté mais auparavant absent de ce profil « tous services ».
[services.ebooksgratuits]
enabled = true
books = 80
seed = 20261006

# Fixtures offline pour les modules jeunesse / critique / constellations / EPUB.
[specialized]
enabled = true
seed = 20261008

# Flux RSS/JSON Feed de critique et autres fixtures éditoriales via localhost.
[services.editorial]
enabled = true
seed = 20261008

# Synthetic BookTrust and OpenLibrary contracts; no real domain redirection.
[services.youth_sources]
enabled = true
seed = 20261009

# Synthetic editor age labels; no production host redirection.
[services.youth_publishers]
enabled = true
seed = 20261009

# Source Éditions Milan simulée, HTTPS officiel inchangé, transport de test injecté.
[services.milan]
enabled = true
seed = 20261009
