name = "ux-errors"
description = "États UX atypiques : téléchargements expirés, indisponibilités et diagnostics."

[runtime]
startup_timeout_seconds = 20

[cifereca]
binary = "cifereca"
no_plugins = true
force_plugins = ["ui.page.home", "ui.page.diagnostics"]
width = 1300
height = 850

[library]
epubs = 25
seed = 20261006


# Scénarios négatifs OPDS disponibles uniquement avec ?ux_fault=...
# (429/503, XML invalide, pagination interrompue), jamais implicitement.
[services.opds]
enabled = true
books_per_source = 500
broken_assets_every = 7
seed = 20261006

[services.kobo]
enabled = true
catalog_books = 1000
vault_books = 150
broken_assets_every = 7
seed = 20261006

[services.numilog]
enabled = true
books = 1000
page_size = 50
seed = 20261006

[services.paris]
enabled = true
books = 1000
active_loans = 80
history_items = 100
bookings = 25
digital_ratio = 0.70
seed = 20261006

[services.bnf]
enabled = true
books = 2000
seed = 20261006

# P0 #771: negative HTML catalogue fixtures are opt-in via ux_fault.
[services.ebooksgratuits]
enabled = true
books = 250
seed = 20261006

# Fixtures offline pour les modules jeunesse / critique / constellations / EPUB.
[specialized]
enabled = true
seed = 20261008

# Flux RSS/JSON Feed de critique et autres fixtures éditoriales via localhost.
[services.editorial]
enabled = true
seed = 20261008

# Synthetic OpenLibrary contracts; no real domain redirection.
[services.youth_sources]
enabled = true
seed = 20261009

# Synthetic editor age labels; no production host redirection.
[services.youth_publishers]
enabled = true
seed = 20261009

# Source Éditions Milan simulée, HTTPS officiel inchangé, transport de test injecté.
[services.milan]
enabled = true
seed = 20261009

# Faux catalogue public Baen uniquement. Le plugin réel n'est pas activé
# automatiquement, car son URL officielle ne peut pas être redirigée.
[services.baen]
enabled = true
seed = 20261009

# 429/503, timeouts, redirections, MIME and file-size failures on localhost.
[services.transport_failures]
enabled = true
seed = 20261009
