name = "ux-all"
description = "Environnement UX complet avec tous les faux services et 1 000 EPUB locaux."

[runtime]
startup_timeout_seconds = 45

[cifereca]
binary = "cifereca"
no_plugins = true
force_plugins = ["ui.page.home", "ui.page.diagnostics"]
width = 1300
height = 850

[library]
epubs = 1000
seed = 20261006

[services.opds]
enabled = true
books_per_source = 10000
seed = 20261006

[services.bnf]
enabled = true
books = 20000
seed = 20261006

[services.kobo]
enabled = true
catalog_books = 10000
vault_books = 1000
seed = 20261006

[services.paris]
enabled = true
books = 10000
active_loans = 120
history_items = 200
bookings = 30
digital_ratio = 0.70
seed = 20261006

[services.numilog]
enabled = true
books = 1000
page_size = 50
seed = 20261006

# Service déjà implémenté mais auparavant absent de ce profil « tous services ».
[services.ebooksgratuits]
enabled = true
books = 2000
seed = 20261006

# Fixtures offline pour les modules jeunesse / critique / constellations / EPUB.
[specialized]
enabled = true
seed = 20261008

# Flux RSS/JSON Feed de critique et autres fixtures éditoriales via localhost.
[services.editorial]
enabled = true
seed = 20261008

# Synthetic BookTrust and OpenLibrary contracts; no real domain redirection.
[services.youth_sources]
enabled = true
seed = 20261009

# Synthetic editor age labels; no production host redirection.
[services.youth_publishers]
enabled = true
seed = 20261009

# Source Éditions Milan simulée, HTTPS officiel inchangé, transport de test injecté.
[services.milan]
enabled = true
seed = 20261009
